    <style>
        :root {
            --bg: #000000;
            --surface: #121216;
            --surface-2: #1c1c22;
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --text: #f5f5f7;
            --muted: #8e8e93;
            --glass: rgba(28, 28, 34, 0.62);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-shine: inset 0 1px 0 rgba(255, 255, 255, 0.22);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --pad: clamp(16px, 3.6vw, 48px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        img { display: block; }

        /* --- APPLE TV TOP LIQUID GLASS BAR --- */
        .tv-header {
            position: fixed;
            top: 0;
            inset-inline: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px var(--pad);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.78) 0%, transparent 100%);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .tv-header.scrolled {
            background: rgba(14, 14, 18, 0.76);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand {
            font-size: 1.38rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            white-space: nowrap;
        }
        .brand span { color: var(--accent-bright); }

        .tv-nav-pill {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine), 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .tv-nav-pill a {
            padding: 7px 15px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.72);
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }
        .tv-nav-pill a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .tv-nav-pill a.active { background: #fff; color: #000; }

        .header-right { display: flex; align-items: center; gap: 10px; }

        .search-capsule { position: relative; display: flex; align-items: center; }
        .search-capsule input {
            width: 220px;
            height: 36px;
            padding: 0 34px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
            color: #fff;
            font-size: 0.84rem;
            outline: none;
            transition: width 0.3s var(--ease), border-color 0.2s ease, background 0.2s ease;
        }
        .search-capsule input::placeholder { color: rgba(255, 255, 255, 0.52); }
        .search-capsule input:focus {
            width: 300px;
            background: rgba(18, 18, 24, 0.92);
            border-color: rgba(255, 255, 255, 0.32);
        }
        .search-capsule .s-ico { position: absolute; left: 13px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.6); pointer-events: none; }
        .search-capsule .f-link { position: absolute; right: 11px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.65); }
        .search-capsule .f-link:hover { color: #fff; }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: min(360px, 92vw);
            max-height: 380px;
            overflow-y: auto;
            padding: 6px;
            border-radius: 16px;
            background: rgba(20, 20, 26, 0.94);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
            display: none;
            z-index: 2000;
        }
        .search-row { display: flex; align-items: center; gap: 11px; padding: 7px 9px; border-radius: 10px; transition: background 0.15s ease; }
        .search-row:hover { background: rgba(255, 255, 255, 0.09); }
        .search-row img { width: 38px; height: 54px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
        .search-row-title { font-size: 0.86rem; font-weight: 600; color: #fff; }
        .search-row-sub { font-size: 0.72rem; color: var(--muted); }

        .auth-pill {
            height: 36px;
            padding: 0 15px;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .auth-pill:hover { opacity: 0.9; transform: scale(1.02); }
        .auth-pill.avatar-only { padding: 0; background: none; }

        .mobile-filter-pill {
            display: none;
            height: 34px;
            padding: 0 13px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
            font-size: 0.78rem;
            font-weight: 600;
            align-items: center;
            gap: 6px;
        }

        .mobile-search-bar { display: none; }

        /* --- FULL-BLEED APPLE TV HERO --- */
        .hero {
            position: relative;
            width: 100%;
            height: clamp(500px, 82vh, 780px);
            overflow: hidden;
            background: #050507;
        }
        .hero-track { display: flex; height: 100%; transition: transform 0.65s var(--ease); will-change: transform; }
        .hero-slide { position: relative; flex: 0 0 100%; width: 100%; height: 100%; overflow: hidden; }
        .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
        .hero-trailer { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
        .hero-trailer.on { opacity: 1; }
        .hero-trailer iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 56.25vw;
            min-width: 177.78vh;
            min-height: 100%;
            border: none;
        }
        .hero-scrim {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(0deg, #000 0%, rgba(0, 0, 0, 0.72) 24%, rgba(0, 0, 0, 0.14) 55%, rgba(0, 0, 0, 0.45) 100%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.25) 45%, transparent 80%);
            pointer-events: none;
        }
        .hero-body {
            position: absolute;
            left: var(--pad);
            bottom: clamp(36px, 7vh, 72px);
            max-width: min(560px, 88vw);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }
        .hero-eyebrow { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.76); }
        .hero-logo { max-width: min(380px, 78vw); max-height: 112px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.75)); }
        .hero-title { font-size: clamp(2rem, 4.4vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
        .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; color: rgba(245, 245, 247, 0.82); }
        .hero-meta .hd-tag { padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.32); font-size: 0.7rem; font-weight: 700; }
        .hero-desc { font-size: 0.94rem; line-height: 1.5; color: rgba(245, 245, 247, 0.78); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
        .btn-apple-primary,
        .btn-apple-glass {
            height: 44px;
            padding: 0 24px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s var(--ease), background 0.2s ease;
            white-space: nowrap;
        }
        .btn-apple-primary { background: #fff; color: #000; }
        .btn-apple-primary:hover { transform: scale(1.03); background: #eaecef; }
        .btn-apple-glass {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: var(--glass-shine);
            color: #fff;
        }
        .btn-apple-glass:hover { background: rgba(255, 255, 255, 0.24); transform: scale(1.03); }
        .btn-apple-glass.active { background: rgba(168, 85, 247, 0.42); border-color: var(--accent-bright); }

        .hero-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 6;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(20, 20, 26, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, background 0.2s ease;
        }
        .hero:hover .hero-arrow { opacity: 1; }
        .hero-arrow:hover { background: rgba(255, 255, 255, 0.22); }
        .hero-arrow.prev { left: 18px; }
        .hero-arrow.next { right: 18px; }

        .hero-dots { position: absolute; right: var(--pad); bottom: 28px; z-index: 6; display: flex; gap: 6px; }
        .hero-dot { width: 7px; height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.32); transition: width 0.28s var(--ease), background 0.28s ease; }
        .hero-dot.active { width: 22px; background: #fff; }

        /* --- FILTER CHIPS STRIP --- */
        .chip-rail { display: flex; align-items: center; gap: 8px; padding: 6px var(--pad) 18px; overflow-x: auto; scrollbar-width: none; }
        .chip-rail::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            padding: 7px 15px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.8);
            transition: background 0.18s ease, color 0.18s ease;
        }
        .chip:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .chip.active { background: #fff; color: #000; border-color: #fff; }

        /* --- CLEAN BORDERLESS APPLE TV SHELVES --- */
        main { position: relative; z-index: 2; padding-bottom: 24px; }

        .shelf {
            padding: 12px 0 22px;
            content-visibility: auto;
            contain-intrinsic-size: 1px 330px;
        }
        .shelf-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--pad) 12px;
            gap: 12px;
        }
        .shelf-title-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: clamp(1.08rem, 1.7vw, 1.36rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            min-width: 0;
        }
        .shelf-title-link span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shelf-title-link i { font-size: 0.8rem; color: var(--muted); transition: transform 0.2s var(--ease), color 0.2s ease; flex-shrink: 0; }
        .shelf-title-link:hover i { transform: translateX(3px); color: #fff; }

        .shelf-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .view-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.76rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.86);
            white-space: nowrap;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }
        .view-all-btn:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.24); color: #fff; }
        .view-all-btn i { font-size: 0.66rem; }

        .shelf-arrows { display: flex; gap: 6px; }
        .shelf-arrow {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.74rem;
            transition: background 0.18s ease;
        }
        .shelf-arrow:hover { background: rgba(255, 255, 255, 0.2); }

        .rail {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px var(--pad) 8px;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .rail::-webkit-scrollbar { display: none; }

        /* --- CLEAN APPLE TV CARDS --- */
        .card { flex: 0 0 176px; width: 176px; position: relative; }
        .card-poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease);
        }
        .card:hover .card-poster-wrap {
            transform: scale(1.035);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.72), 0 0 0 1.5px rgba(255, 255, 255, 0.28);
        }
        .card-poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .card-add {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.18s ease, background 0.18s ease;
            z-index: 3;
        }
        .card:hover .card-add, .card-add.active { opacity: 1; }
        .card-add.active { background: var(--accent); border-color: var(--accent-bright); }

        .card-title { margin-top: 8px; font-size: 0.84rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { margin-top: 2px; font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Top 10 Rank Numbers */
        .card.ranked { margin-left: 34px; }
        .card-rank {
            position: absolute;
            left: -40px;
            bottom: 34px;
            font-size: 118px;
            font-weight: 900;
            line-height: 0.8;
            color: #000;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.62);
            pointer-events: none;
            letter-spacing: -6px;
        }

        /* Continue Watching 16:9 Up Next Cards */
        .cw-card { flex: 0 0 264px; width: 264px; position: relative; cursor: pointer; }
        .cw-thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--surface); transition: transform 0.25s var(--ease); }
        .cw-card:hover .cw-thumb { transform: scale(1.03); }
        .cw-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .cw-bar-bg { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.28); overflow: hidden; }
        .cw-bar-fill { height: 100%; background: #fff; border-radius: 4px; }
        .cw-del {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.68);
            color: #fff;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.18s ease, background 0.18s ease;
        }
        .cw-card:hover .cw-del { opacity: 1; }
        .cw-del:hover { background: #ef4444; }

        .skel {
            flex: 0 0 176px;
            width: 176px;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            background: linear-gradient(90deg, #121216 25%, #1c1c24 50%, #121216 75%);
            background-size: 200% 100%;
            animation: sk 1.4s ease infinite;
        }
        @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- HYBRID AD BANDS (HILLTOPADS + ADSTERRA) --- */
        .ad-band { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px var(--pad) 16px; gap: 4px; }
        .ad-lbl { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.28); user-select: none; }
        .ad-slot { width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 12px; }
        .ad-slot iframe, .ad-slot img, .ad-slot ins { max-width: 100%; border: none; border-radius: 10px; }
        .ad-728-box { width: 728px; height: 90px; display: flex; justify-content: center; align-items: center; transform-origin: center; }

        .card.ad-inline { display: flex; align-items: center; justify-content: center; aspect-ratio: 2 / 3; border-radius: 12px; background: var(--surface); overflow: hidden; }

        /* --- ENDLESS LOADER, TOAST, FOOTER, PROFILE SWITCHER --- */
        .endless-sentinel { padding: 20px var(--pad) 34px; display: flex; justify-content: center; color: var(--muted); font-size: 0.82rem; font-weight: 600; gap: 8px; align-items: center; }

        .tv-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px var(--pad) 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            color: var(--muted);
            font-size: 0.82rem;
        }
        .footer-links { display: flex; gap: 18px; }
        .footer-links a:hover { color: #fff; }

        .toast {
            position: fixed;
            top: 76px;
            right: var(--pad);
            z-index: 3000;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(28, 28, 34, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        #home-profile-switcher-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;

            const i = list.findIndex((x) => String(x.id) === String(id));

                list.splice(i, 1); delete map[id];
                btn.classList.remove("active");
                btn.innerHTML = btn.classList.contains("btn-apple-glass") ? '<i class="fas fa-plus"></i> My List' : '<i class="fas fa-plus"></i>';
                toast("Removed from My List");
            } else {

                list.push(entry); map[id] = entry;
                btn.classList.add("active");
                btn.innerHTML = btn.classList.contains("btn-apple-glass") ? '<i class="fas fa-check"></i> In My List' : '<i class="fas fa-check"></i>';
                toast("Added to My List");

            localStorage.setItem("dramakan_mylist", JSON.stringify(list));
            localStorage.setItem("dramakan_watchlist", JSON.stringify(map));

            if (fb?.auth.currentUser) {
                try {
                    const { doc, getDoc, updateDoc } = fb.fs;
                    const ref = doc(fb.db, "users", fb.auth.currentUser.uid);
                    const snap = await getDoc(ref);
                    if (snap.exists()) {

                            const idx = Math.max(0, d.profiles.findIndex((p) => p.id === localStorage.getItem("dramakan_active_profile_id")));

                    }
                } catch {}
            }
        };

        const dataObs = new IntersectionObserver((entries, obs) => {
            entries.forEach(async (e) => {

                const cfg = shelfMap.get(e.target.id);

                obs.unobserve(e.target);
                try {
                    const r = await fetch(cfg.url);
                    if (!r.ok) throw 0;
                    const d = await r.json();
                    const res = (d.results || []).filter((x) => x.poster_path).slice(0, 16);
                    if (!res.length) return e.target.closest(".shelf")?.remove();
                    renderRail(e.target, res, { inlineAd: cfg.inlineAd });

                    e.target.closest(".shelf")?.remove();
                }
            });
        }, { rootMargin: "700px 0px" });

                const sec = document.createElement("section");

                if (mounted % 3 === 0) {

                    const dot = document.createElement("button");
                    dot.type = "button";
                    dot.className = idx === 0 ? "hero-dot active" : "hero-dot";
                    dot.dataset.dot = String(idx);
                    dot.setAttribute("aria-label", `Slide ${idx + 1}`);
                    dFrag.appendChild(dot);
                });

                track.innerHTML = ""; track.appendChild(sFrag);
                dots.innerHTML = ""; dots.appendChild(dFrag);
                heroTotal = detailed.length;
                resetHeroAuto();
            } catch {}
        }

        // Global Delegated Events (Hero, Shelves, Header Scroll, Search)
        document.getElementById("heroPrev").addEventListener("click", () => { setSlide(heroIdx - 1); resetHeroAuto(); });
        document.getElementById("heroNext").addEventListener("click", () => { setSlide(heroIdx + 1); resetHeroAuto(); });
        document.getElementById("heroDots").addEventListener("click", (e) => { const d = e.target.closest("[data-dot]"); if (d) { setSlide(+d.dataset.dot); resetHeroAuto(); } });

        const heroEl = document.getElementById("heroSection");
        let sx = 0;
        heroEl.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; clearInterval(heroTimer); }, { passive: true });
        heroEl.addEventListener("touchend", (e) => { const dx = sx - e.changedTouches[0].clientX; if (dx > 45) setSlide(heroIdx + 1); else if (dx < -45) setSlide(heroIdx - 1); resetHeroAuto(); }, { passive: true });

        heroEl.addEventListener("click", (e) => {
            const b = e.target.closest("[data-hero-add]");
            if (!b) return;
            window.toggleMyList(b, decodeURIComponent(b.dataset.t), b.dataset.i, `watch.html?id=${b.dataset.heroAdd}`, b.dataset.heroAdd);
        });

        heroEl.addEventListener("pointerenter", (e) => {
            if (window.innerWidth <= 960) return;
            const s = e.target.closest(".hero-slide");
            const k = s?.dataset.trailer;
            if (!k) return;
            const box = s.querySelector(".hero-trailer");
            if (box && !box.innerHTML) box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(k)}?autoplay=1&mute=1&controls=0&loop=1&playlist=${encodeURIComponent(k)}&playsinline=1" allow="autoplay;encrypted-media"></iframe>`;
            box?.classList.add("on");
        }, true);
        heroEl.addEventListener("pointerleave", (e) => { e.target.closest(".hero-slide")?.querySelector(".hero-trailer")?.classList.remove("on"); }, true);

        document.getElementById("gallery").addEventListener("click", (e) => {
            const arr = e.target.closest(".shelf-arrow");
            if (arr) {
                const rail = document.getElementById(arr.dataset.scroll);
                rail?.scrollBy({ left: (+arr.dataset.d) * Math.max(rail.clientWidth * 0.8, 360), behavior: "smooth" });
                return;
            }
            const bm = e.target.closest("[data-toggle-list]");
            if (bm) {
                e.preventDefault(); e.stopPropagation();
                const c = bm.closest(".card");
                window.toggleMyList(bm, c.dataset.title, c.dataset.img, `watch.html?id=${c.dataset.id}`, c.dataset.id);
            }
        });

        // Header frost on scroll
        const hdr = document.getElementById("tvHeader");
        let ticking = false;
        window.addEventListener("scroll", () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => { hdr.classList.toggle("scrolled", window.scrollY > 36); ticking = false; });
        }, { passive: true });

        // Live Search (PC + Mobile)
        function bindSearch(inId, resId) {
            const inp = document.getElementById(inId), box = document.getElementById(resId);
            if (!inp || !box) return;
            let t = null, seq = 0;
            inp.addEventListener("input", () => {
                clearTimeout(t);
                const q = inp.value.trim();
                if (!q) { box.style.display = "none"; return; }
                t = setTimeout(async () => {
                    const id = ++seq;
                    try {
                        const d = await fetch(`${API}/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}`).then((r) => r.json());
                        if (id !== seq) return;
                        const rows = (d.results || []).filter((x) => x.media_type === "tv" || x.media_type === "movie").slice(0, 8);
                        box.innerHTML = "";
                        if (!rows.length) {
                            box.innerHTML = '<div style="padding:12px;text-align:center;color:var(--muted);font-size:0.82rem;">No results</div>';
                        } else {
                            const f = document.createDocumentFragment();
                            rows.forEach((x) => {
                                const a = document.createElement("a");
                                a.href = `watch.html?id=${encodeURIComponent(x.id)}`;
                                a.className = "search-row";
                                a.innerHTML = `<img src="${x.poster_path ? IMG + "/w92" + x.poster_path : "default-poster.jpg"}" alt=""><div><div class="search-row-title"></div><div class="search-row-sub"></div></div>`;
                                a.querySelector(".search-row-title").textContent = x.title || x.name;
                                a.querySelector(".search-row-sub").textContent = `${x.media_type.toUpperCase()} · ${(x.release_date || x.first_air_date || "").slice(0, 4)}`;
                                f.appendChild(a);
                            });
                            box.appendChild(f);
                        }
                        box.style.display = "block";
                    } catch {}
                }, 260);
            });
            document.addEventListener("click", (e) => { if (!inp.contains(e.target) && !box.contains(e.target)) box.style.display = "none"; });
        }
        bindSearch("searchInput", "searchResults");
        bindSearch("mobileSearchInput", "mobileSearchResults");

        // Auth, VIP Privileges, Profile Switcher & Cloud History Sync
        function setAvatarUI(profiles) {
            if (!profiles.length) return;
            const prof = profiles.find((p) => p.id === localStorage.getItem("dramakan_active_profile_id")) || profiles[0];
            const av = prof.avatar;
            const emoji = av && av.length <= 10 && !av.includes("http") && !av.includes("data:image");
            const topBtn = document.getElementById("topAuthBtn");
            const botBtn = document.getElementById("bottomAuthBtn");
            if (topBtn) {
                topBtn.href = "profile.html";
                topBtn.classList.add("avatar-only");
                topBtn.innerHTML = emoji
                    ? `<div style="width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--accent-bright);display:grid;place-items:center;font-size:1.15rem;">${av}</div>`
                    : `<img src="${av}" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent-bright);">`;
            }
            if (botBtn) {
                botBtn.href = "profile.html";
                botBtn.innerHTML = emoji
                    ? `<div style="width:22px;height:22px;border-radius:50%;border:1px solid var(--accent-bright);display:grid;place-items:center;font-size:0.8rem;">${av}</div><span>Profile</span>`
                    : `<img src="${av}" alt="Profile" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--accent-bright);"><span>Profile</span>`;
            }
        }

        function resetAuthUI() {
            const topBtn = document.getElementById("topAuthBtn");
            const botBtn = document.getElementById("bottomAuthBtn");
            if (topBtn) {
                topBtn.href = "login.html";
                topBtn.classList.remove("avatar-only");
                topBtn.innerHTML = '<i class="fa-solid fa-user"></i> Sign In';
            }
            if (botBtn) {
                botBtn.href = "login.html";
                botBtn.innerHTML = '<i class="fa-solid fa-user"></i><span>Profile</span>';
            }
        }

        function showSwitcher(profiles) {
            if (document.getElementById("home-profile-switcher-overlay")) return;
            const ov = document.createElement("div");
            ov.id = "home-profile-switcher-overlay";
            ov.innerHTML = '<h2 style="font-size:1.6rem;font-weight:700;">Who\'s watching?</h2><div class="profiles-list"></div>';
            const list = ov.querySelector(".profiles-list");
            profiles.forEach((p) => {
                const c = document.createElement("div");
                c.className = "profile-select-card";
                const emoji = p.avatar && p.avatar.length <= 10 && !p.avatar.includes("http") && !p.avatar.includes("data:image");
                c.innerHTML = emoji ? `<div class="switcher-avatar-img">${p.avatar}</div>` : `<img class="switcher-avatar-img" src="${p.avatar}" alt="">`;
                const n = document.createElement("span");
                n.style.cssText = "color:var(--muted);font-size:0.92rem;font-weight:600;";
                n.textContent = p.name;
                c.appendChild(n);
                c.addEventListener("click", () => {
                    localStorage.setItem("dramakan_profile_prompt_date", new Date().toDateString());
                    localStorage.setItem("dramakan_active_profile_id", p.id);
                    setAvatarUI(profiles);
                    ov.classList.add("hidden");
                    setTimeout(() => ov.remove(), 350);
                });
                list.appendChild(c);
            });
            document.body.appendChild(ov);
        }

        async function initAuth() {
            try {
                const { auth, db, au, fs } = await getFb();
                au.onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        if (unsubHist) { unsubHist(); unsubHist = null; }
                        resetAuthUI();
                        return renderCW();
                    }
                    try { applySubscriptionPrivileges(await getSubscriptionStatus(db, user.uid)); } catch {}
                    fs.onSnapshot(fs.doc(db, "users", user.uid), (snap) => {
                        const d = snap.exists() ? snap.data() : {};
                        const fallback = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(user.displayName || user.email || "U")}`;
                        const profs = d.profiles?.length ? d.profiles : [{ id: "default", name: d.username || "User", avatar: d.avatarUrl || fallback }];
                        if (localStorage.getItem("dramakan_profile_prompt_date") !== new Date().toDateString() && profs.length > 1) showSwitcher(profs);
                        else setAvatarUI(profs);
                    });
                    if (unsubHist) unsubHist();
                    unsubHist = fs.onSnapshot(fs.collection(db, "users", user.uid, "history"), (snap) => {
                        const map = {};
                        snap.forEach((doc) => { const h = doc.data(); if (h?.dramaId) { h.id = String(h.dramaId); map[h.id] = h; } });
                        localStorage.setItem("dramakan_history", JSON.stringify(map));
                        renderCW(Object.values(map).filter((x) => x.link && x.title && !x.link.includes("index.html")).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 12));
                    });
                });
            } catch { renderCW(); }
        }

        // Auto-hide empty Hilltop slot if desktop receives no fill
        if (!isVip()) {
            setTimeout(() => {
                const el = document.querySelector('.ad-band[data-ad="hilltop"]');
                if (el && el.querySelector(".ad-slot").getBoundingClientRect().height < 40) el.style.display = "none";
            }, 7000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderCW();
            initHome();
            initAuth();
        });
    </script>
</body>
</html>
