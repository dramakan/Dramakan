<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title id="pageTitle">Category — Dramakan</title>
    <meta name="description" content="Watch blockbuster movies, trending TV shows, hit anime, and Asian dramas by category in HD on Dramakan.">
    <meta name="robots" content="index, follow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dramakan">
    <meta name="theme-color" content="#000000">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="feedback-popup.js" defer></script>
    <script type="module" src="global-login-popup.js" defer></script>

    <script>
        (function () {
            const p = localStorage.getItem("dramakan_user_plan") || "";
            if (p.includes("Premium") || p.includes("Crown")) {
                document.documentElement.classList.add("premium-ad-free-mode");
            }
        })();
    </script>

    <style>
        :root {
            --bg: #000000;
            --surface: #121216;
            --surface-2: #1c1c22;
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --text: #f5f5f7;
            --muted: #8e8e93;
            --glass: rgba(28, 28, 34, 0.64);
            --glass-sheet: linear-gradient(160deg, rgba(36, 36, 48, 0.82) 0%, rgba(14, 14, 20, 0.92) 100%);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-shine: inset 0 1px 0 rgba(255, 255, 255, 0.24);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --pad: clamp(16px, 3.6vw, 48px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            overflow-x: clip;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        body.dir-locked { overflow: hidden; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        img { display: block; }

        /* --- APPLE TV TOP BAR --- */
        .tv-header {
            position: fixed;
            top: 0;
            inset-inline: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px var(--pad);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.82) 0%, transparent 100%);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .tv-header.scrolled {
            background: rgba(14, 14, 18, 0.78);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand { font-size: 1.38rem; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; }
        .brand span { color: var(--accent-bright); }

        .tv-nav-pill {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine), 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .tv-nav-pill a {
            padding: 7px 15px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.72);
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }
        .tv-nav-pill a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .tv-nav-pill a.active { background: #fff; color: #000; }

        .header-right { display: flex; align-items: center; gap: 10px; }
        .search-capsule { position: relative; display: flex; align-items: center; }
        .search-capsule input {
            width: 220px;
            height: 36px;
            padding: 0 34px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
            color: #fff;
            font-size: 0.84rem;
            outline: none;
            transition: width 0.3s var(--ease), border-color 0.2s ease, background 0.2s ease;
        }
        .search-capsule input::placeholder { color: rgba(255, 255, 255, 0.52); }
        .search-capsule input:focus { width: 300px; background: rgba(18, 18, 24, 0.92); border-color: rgba(255, 255, 255, 0.32); }
        .search-capsule .s-ico { position: absolute; left: 13px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.6); pointer-events: none; }
        .search-capsule .f-link { position: absolute; right: 11px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.65); }
        .search-capsule .f-link:hover { color: #fff; }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: min(360px, 92vw);
            max-height: 380px;
            overflow-y: auto;
            padding: 6px;
            border-radius: 16px;
            background: rgba(20, 20, 26, 0.95);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
            display: none;
            z-index: 2000;
        }
        .search-row { display: flex; align-items: center; gap: 11px; padding: 7px 9px; border-radius: 10px; transition: background 0.15s ease; }
        .search-row:hover { background: rgba(255, 255, 255, 0.09); }
        .search-row img { width: 38px; height: 54px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
        .search-row-title { font-size: 0.86rem; font-weight: 600; color: #fff; }
        .search-row-sub { font-size: 0.72rem; color: var(--muted); }

        .auth-pill {
            height: 36px;
            padding: 0 15px;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .auth-pill:hover { opacity: 0.9; transform: scale(1.02); }
        .auth-pill.avatar-only { padding: 0; background: none; }

        .mobile-filter-pill {
            display: none;
            height: 34px;
            padding: 0 13px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
            font-size: 0.78rem;
            font-weight: 600;
            align-items: center;
            gap: 6px;
        }
        .mobile-search-bar { display: none; }

        /* --- SINGLE-CATEGORY CINEMA HERO --- */
        .cat-hero {
            position: relative;
            width: 100%;
            min-height: clamp(255px, 38vh, 390px);
            padding: 96px var(--pad) 26px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            background: #06060b;
        }
        .cat-hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 22%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .cat-hero-bg.ready { opacity: 0.46; }
        .cat-hero-scrim {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(0deg, #000 0%, rgba(0, 0, 0, 0.72) 48%, rgba(0, 0, 0, 0.42) 100%),
                linear-gradient(90deg, rgba(0, 0, 0, 0.82) 0%, transparent 72%);
            pointer-events: none;
        }
        .cat-hero-row {
            position: relative;
            z-index: 3;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }
        .cat-crumb {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }
        .cat-crumb a:hover { color: #fff; }
        .cat-title { font-size: clamp(1.85rem, 4.2vw, 3.1rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
        .cat-sub { margin-top: 6px; font-size: 0.88rem; color: rgba(245, 245, 247, 0.74); }

        .cat-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-apple-primary, .btn-apple-glass {
            height: 40px;
            padding: 0 20px;
            border-radius: 999px;
            font-size: 0.86rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: transform 0.2s var(--ease), background 0.2s ease;
        }
        .btn-apple-primary { background: #fff; color: #000; }
        .btn-apple-primary:hover { transform: scale(1.03); background: #eaecef; }
        .btn-apple-glass {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: var(--glass-shine);
            color: #fff;
        }
        .btn-apple-glass:hover { background: rgba(255, 255, 255, 0.24); transform: scale(1.02); }

        /* --- RELATED CHIPS & SORT BAR --- */
        .chip-rail { display: flex; align-items: center; gap: 8px; padding: 6px var(--pad) 12px; overflow-x: auto; scrollbar-width: none; }
        .chip-rail::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.8);
            transition: background 0.18s ease, color 0.18s ease;
            white-space: nowrap;
        }
        .chip:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .chip.active { background: #fff; color: #000; border-color: #fff; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 2px var(--pad) 18px;
        }
        .segmented {
            display: inline-flex;
            padding: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }
        .seg-btn {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.72);
            transition: background 0.18s ease, color 0.18s ease;
        }
        .seg-btn.active { background: #fff; color: #000; }
        .count-meta { font-size: 0.8rem; font-weight: 600; color: var(--muted); }

        /* --- CATEGORY-ONLY POSTER GRID --- */
        .grid-shell { padding: 0 var(--pad) 26px; }
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
            gap: 22px 14px;
        }
        .card { position: relative; min-width: 0; }
        .card-poster-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease);
        }
        .card:hover .card-poster-wrap {
            transform: scale(1.035);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.72), 0 0 0 1.5px rgba(255, 255, 255, 0.28);
        }
        .card-poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .card-add {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.18s ease, background 0.18s ease;
            z-index: 3;
        }
        .card:hover .card-add, .card-add.active { opacity: 1; }
        .card-add.active { background: var(--accent); border-color: var(--accent-bright); }

        .card-title { margin-top: 8px; font-size: 0.84rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { margin-top: 2px; font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .skel {
            aspect-ratio: 2 / 3;
            border-radius: 12px;
            background: linear-gradient(90deg, #121216 25%, #1c1c24 50%, #121216 75%);
            background-size: 200% 100%;
            animation: sk 1.4s ease infinite;
        }
        @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Pure Banner-Only Ad Bands (Sandboxed — Zero Popunders) */
        .ad-band { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
        .ad-lbl { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.28); user-select: none; }
        .ad-slot { width: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 12px; }
        .ad-slot iframe { max-width: 100%; border: none; border-radius: 10px; }
        .ad-728-box { width: 728px; height: 90px; display: flex; justify-content: center; align-items: center; transform-origin: center; }

        /* --- FIXED APPLE LIQUID GLASS CATEGORIES SELECTOR --- */
        .dir-bg {
            position: fixed;
            inset: 0;
            z-index: 100000;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }
        .dir-bg.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .dir-sheet {
            width: min(880px, 100%);
            height: min(82dvh, 720px);
            border-radius: 28px;
            background: var(--glass-sheet);
            backdrop-filter: blur(36px) saturate(190%);
            -webkit-backdrop-filter: blur(36px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 34px 80px rgba(0, 0, 0, 0.88), var(--glass-shine);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.96) translateY(14px);
            transition: transform 0.28s var(--ease);
        }
        .dir-bg.open .dir-sheet {
            transform: scale(1) translateY(0);
        }

        .dir-head {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px 20px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
            background: rgba(255, 255, 255, 0.02);
        }
        .dir-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .dir-heading {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dir-heading strong {
            font-size: 1.12rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .dir-count-pill {
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: var(--accent-bright);
            font-size: 0.7rem;
            font-weight: 700;
        }
        .dir-x {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 1.15rem;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: background 0.18s ease;
        }
        .dir-x:hover { background: rgba(255, 255, 255, 0.2); }

        .dir-search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .dir-search-wrap i {
            position: absolute;
            left: 14px;
            font-size: 0.82rem;
            color: var(--muted);
            pointer-events: none;
        }
        .dir-search-wrap input {
            width: 100%;
            height: 40px;
            padding: 0 16px 0 38px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .dir-search-wrap input::placeholder { color: rgba(255, 255, 255, 0.45); }
        .dir-search-wrap input:focus {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(192, 132, 252, 0.55);
        }

        .dir-clusters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .dir-clusters::-webkit-scrollbar { display: none; }
        .dir-cluster-btn {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(245, 245, 247, 0.74);
            font-size: 0.76rem;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .dir-cluster-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
        .dir-cluster-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* Properly Scrollable Grid — Never Squishes Rows */
        .dir-grid {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 16px 20px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            grid-auto-rows: max-content;
            align-content: start;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
        }
        .dir-item {
            min-height: 46px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: rgba(245, 245, 247, 0.9);
            transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
        }
        .dir-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }
        .dir-item.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.36), rgba(109, 40, 217, 0.28));
            border-color: var(--accent-bright);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }
        .dir-item-label {
            min-width: 0;
            flex: 1;
            font-size: 0.84rem;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dir-item-tag {
            flex-shrink: 0;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
        }
        .dir-item.active .dir-item-tag {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .dir-empty {
            grid-column: 1 / -1;
            padding: 40px 16px;
            text-align: center;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .sentinel { padding: 24px var(--pad) 38px; display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--muted); font-size: 0.82rem; font-weight: 600; }

        .tv-footer { border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 28px var(--pad) 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 0.82rem; }
        .footer-links { display: flex; gap: 18px; }
        .footer-links a:hover { color: #fff; }

        .toast { position: fixed; top: 76px; right: var(--pad); z-index: 100010; padding: 10px 18px; border-radius: 999px; background: rgba(28, 28, 34, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); color: #fff; font-size: 0.82rem; font-weight: 600; opacity: 0; transform: translateY(-10px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }

        // Pulls the exact CATS array straight from index.html so every category matches 1:1
        async function syncCatalogFromIndex() {
            const map = new Map(CORE_CATS.map((c) => [c.slug, c]));
            try {
                const res = await fetch("index.html", { cache: "no-store" });
                if (res.ok) {
                    const html = await res.text();
                    const block = html.match(/const\s+CATS\s*=\s*\[([\s\S]*?)\];/);
                    if (block) {
                        const rowRe = /\[\s*["']([^"']+)["']\s*,\s*["']([mt])["']\s*,\s*["']([^"']+)["']\s*,\s*["']([^"']*)["']/g;
                        let m;
                        while ((m = rowRe.exec(block[1])) !== null) {
                            const title = m[1], type = m[2], path = m[3], clusters = m[4].split(/\s+/).filter(Boolean);

                            map.set(slug, { title, type, path, clusters, slug });

            const band = document.createElement("div");

        function buildUrl(cat, pg) {
            const url = new URL(`${API}${cat.path}`);
            url.searchParams.set("api_key", KEY);

                    url.searchParams.set("sort_by", "vote_average.desc");
                    if (!url.searchParams.has("vote_count.gte")) url.searchParams.set("vote_count.gte", "80");
                } else if (sortMode === "newest") {
                    url.searchParams.set("sort_by", cat.type === "m" ? "primary_release_date.desc" : "first_air_date.desc");
                    url.searchParams.set(cat.type === "m" ? "primary_release_date.lte" : "first_air_date.lte", TODAY);
                }
            }
            return url.toString();

            const rail = $("relatedChips");
            const sameCluster = catalog.filter((c) => c.slug !== activeCat.slug && (c.clusters || []).some((cl) => (activeCat.clusters || []).includes(cl)));
            const pool = [activeCat, ...sameCluster, ...catalog.slice(0, 12)];
            const unique = Array.from(new Map(pool.map((c) => [c.slug, c])).values()).slice(0, 14);

            const f = document.createDocumentFragment();
            unique.forEach((c) => {
                const a = document.createElement("a");
                a.href = `category.html?c=${encodeURIComponent(c.slug)}`;
                a.className = c.slug === activeCat.slug ? "chip active" : "chip";
                a.dataset.pickSlug = c.slug;
                a.textContent = c.title;
                f.appendChild(a);
            });
            rail.innerHTML = "";
            rail.appendChild(f);
        }

        function renderDirectory() {
            const term = ($("dirSearch").value || "").trim().toLowerCase();
            let list = catalog;
            if (dirCluster !== "all") {
                list = list.filter((c) => (c.clusters || []).includes(dirCluster) || c.type === dirCluster);
            }
            if (term) {
                list = list.filter((c) => c.title.toLowerCase().includes(term));
            }
            $("dirCountPill").textContent = String(list.length);

            const grid = $("dirGrid");
            if (!list.length) {
                grid.innerHTML = '<div class="dir-empty">No matching categories found.</div>';
                return;
            }

            const f = document.createDocumentFragment();
            list.forEach((c) => {
                const a = document.createElement("a");
                a.href = `category.html?c=${encodeURIComponent(c.slug)}`;
                a.className = c.slug === activeCat.slug ? "dir-item active" : "dir-item";
                a.dataset.pickSlug = c.slug;

                const lbl = document.createElement("span");
                lbl.className = "dir-item-label";
                lbl.textContent = c.title;

                const tag = document.createElement("span");
                tag.className = "dir-item-tag";
                tag.textContent = c.type === "m" ? "Film" : "TV";

                a.append(lbl, tag);
                f.appendChild(a);
            });
            grid.innerHTML = "";
            grid.appendChild(f);
        }

        function setDirOpen(open) {
            const dirBg = $("dirOverlay");
            dirBg.classList.toggle("open", open);
            document.body.classList.toggle("dir-locked", open);
            if (open) {
                renderDirectory();
                $("dirGrid").scrollTop = 0;
            }
        }

        function openCategory(cat, pushUrl = false) {
            activeCat = cat;
            sortMode = "default";
            page = 1;
            totalPages = 20;
            loadedCount = 0;
            adSeq = 0;

            if (pushUrl) {
                history.pushState({ slug: cat.slug }, "", `category.html?c=${encodeURIComponent(cat.slug)}`);
            }

            document.title = `${cat.title} — Dramakan`;
            $("catTitle").textContent = cat.title;
            $("catTypeLabel").textContent = cat.type === "m" ? "Movies" : "TV & Series";
            $("catSub").textContent = `Stream the best ${cat.title.toLowerCase()} online free in Full HD.`;
            $("catHeroBg").classList.remove("ready");
            $("playFirstBtn").style.display = "none";

            document.querySelectorAll(".tv-nav-pill a[data-nav]").forEach((a) => {
                a.classList.toggle("active", a.dataset.nav === cat.slug);
            });
            $("sortBar").style.display = cat.path.startsWith("/discover/") ? "inline-flex" : "none";
            document.querySelectorAll(".seg-btn").forEach((b) => b.classList.toggle("active", b.dataset.sort === "default"));

            renderRelatedChips();
            renderDirectory();
            fillSkels(18);
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadNextPage();
        }

        // My List Toggle (Local + Firebase)
        async function toggleMyList(btn, title, img, id) {
            let list = [], map = {};
            try {
                list = JSON.parse(localStorage.getItem("dramakan_mylist")) || [];
                map = JSON.parse(localStorage.getItem("dramakan_watchlist")) || {};
            } catch {}
            const idx = list.findIndex((x) => String(x.id) === String(id));
            if (idx > -1) {
                list.splice(idx, 1);
                delete map[id];
                btn.classList.remove("active");
                btn.innerHTML = '<i class="fas fa-plus"></i>';
                toast("Removed from My List");
            } else {
                const entry = { id: String(id), title, img, link: `watch.html?id=${id}`, timestamp: Date.now() };
                list.push(entry);
                map[id] = entry;
                btn.classList.add("active");
                btn.innerHTML = '<i class="fas fa-check"></i>';
                toast("Added to My List");
            }
            localStorage.setItem("dramakan_mylist", JSON.stringify(list));
            localStorage.setItem("dramakan_watchlist", JSON.stringify(map));

            if (fb?.auth.currentUser) {
                try {
                    const ref = fb.fs.doc(fb.db, "users", fb.auth.currentUser.uid);
                    const snap = await fb.fs.getDoc(ref);
                    if (snap.exists()) {
                        const d = snap.data();
                        if (d.profiles?.length) {
                            const pi = Math.max(0, d.profiles.findIndex((p) => p.id === localStorage.getItem("dramakan_active_profile_id")));
                            d.profiles[pi].myList = list;
                            await fb.fs.updateDoc(ref, { profiles: d.profiles });
                        } else {
                            await fb.fs.updateDoc(ref, { myList: list });
                        }
                    }
                } catch {}
            }
        }

        // Delegated Events
        gridEl.addEventListener("click", (e) => {
            const b = e.target.closest("[data-toggle-list]");
            if (!b) return;
            e.preventDefault();
            e.stopPropagation();
            const c = b.closest(".card");
            toggleMyList(b, c.dataset.title, c.dataset.img, c.dataset.id);
        });

        $("sortBar").addEventListener("click", (e) => {
            const b = e.target.closest(".seg-btn");
            if (!b || b.dataset.sort === sortMode) return;
            document.querySelectorAll(".seg-btn").forEach((x) => x.classList.toggle("active", x === b));
            sortMode = b.dataset.sort;
            page = 1; totalPages = 20; loadedCount = 0; adSeq = 0;
            fillSkels(18);
            loadNextPage();
        });

        // Categories Selector Sheet Controls
        $("openDirBtn").addEventListener("click", () => setDirOpen(true));
        $("closeDirBtn").addEventListener("click", () => setDirOpen(false));
        $("dirOverlay").addEventListener("click", (e) => { if (e.target.id === "dirOverlay") setDirOpen(false); });
        $("dirSearch").addEventListener("input", renderDirectory);

        $("dirClusters").addEventListener("click", (e) => {
            const b = e.target.closest(".dir-cluster-btn");
            if (!b || b.dataset.cluster === dirCluster) return;
            document.querySelectorAll(".dir-cluster-btn").forEach((x) => x.classList.toggle("active", x === b));
            dirCluster = b.dataset.cluster;
            renderDirectory();
            $("dirGrid").scrollTop = 0;
        });

        $("bottomBrowseBtn").addEventListener("click", (e) => {
            e.preventDefault();
            setDirOpen(!$("dirOverlay").classList.contains("open"));
        });

        document.addEventListener("click", (e) => {
            const a = e.target.closest("[data-pick-slug]");
            if (!a || e.metaKey || e.ctrlKey) return;
            const cat = catalog.find((c) => c.slug === a.dataset.pickSlug);
            if (!cat) return;
            e.preventDefault();
            setDirOpen(false);
            openCategory(cat, true);
        });

        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDirOpen(false); });
        window.addEventListener("popstate", () => {
            const sl = new URLSearchParams(location.search).get("c") || "trending";
            openCategory(catalog.find((c) => c.slug === sl) || catalog[0], false);
        });

        new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) loadNextPage(); }, { rootMargin: "750px 0px" })
            .observe($("sentinel"));

        // Header scroll frost
        const hdr = $("tvHeader");
        let tick = false;
        window.addEventListener("scroll", () => {
            if (tick) return;
            tick = true;
            requestAnimationFrame(() => { hdr.classList.toggle("scrolled", window.scrollY > 30); tick = false; });
        }, { passive: true });

        // Live Search (Desktop + Mobile)
        function bindSearch(inId, resId) {
            const inp = $(inId), box = $(resId);
            if (!inp || !box) return;
            let t = null, seq = 0;
            inp.addEventListener("input", () => {
                clearTimeout(t);
                const q = inp.value.trim();
                if (!q) { box.style.display = "none"; return; }
                t = setTimeout(async () => {
                    const tok = ++seq;
                    try {
                        const d = await fetch(`${API}/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}`).then((r) => r.json());
                        if (tok !== seq) return;
                        const rows = (d.results || []).filter((x) => x.media_type === "tv" || x.media_type === "movie").slice(0, 8);
                        box.innerHTML = "";
                        if (!rows.length) {
                            box.innerHTML = '<div style="padding:12px;text-align:center;color:var(--muted);font-size:0.82rem;">No results</div>';
                        } else {
                            const f = document.createDocumentFragment();
                            rows.forEach((x) => {
                                const a = document.createElement("a");
                                a.href = `watch.html?id=${encodeURIComponent(x.id)}`;
                                a.className = "search-row";
                                a.innerHTML = `<img src="${x.poster_path ? IMG + "/w92" + x.poster_path : "default-poster.jpg"}" alt=""><div><div class="search-row-title"></div><div class="search-row-sub"></div></div>`;
                                a.querySelector(".search-row-title").textContent = x.title || x.name;
                                a.querySelector(".search-row-sub").textContent = `${x.media_type.toUpperCase()} · ${(x.release_date || x.first_air_date || "").slice(0, 4)}`;
                                f.appendChild(a);
                            });
                            box.appendChild(f);
                        }
                        box.style.display = "block";
                    } catch {}
                }, 260);
            });
            document.addEventListener("click", (e) => { if (!inp.contains(e.target) && !box.contains(e.target)) box.style.display = "none"; });
        }
        bindSearch("searchInput", "searchResults");
        bindSearch("mobileSearchInput", "mobileSearchResults");

        // Auth + Avatar Sync
        function resetAuthUI() {
            const topBtn = $("topAuthBtn"), botBtn = $("bottomAuthBtn");
            if (topBtn) {
                topBtn.href = "login.html";
                topBtn.classList.remove("avatar-only");
                topBtn.innerHTML = '<i class="fa-solid fa-user"></i> Sign In';
            }
            if (botBtn) {
                botBtn.href = "login.html";
                botBtn.innerHTML = '<i class="fa-solid fa-user"></i><span>Profile</span>';
            }
        }

        async function initAuth() {
            try {
                const { auth, db, au, fs } = await getFb();
                au.onAuthStateChanged(auth, async (user) => {
                    if (!user) return resetAuthUI();
                    try { applySubscriptionPrivileges(await getSubscriptionStatus(db, user.uid)); } catch {}
                    fs.onSnapshot(fs.doc(db, "users", user.uid), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data();
                        const fbAv = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(user.displayName || user.email || "U")}`;
                        const prof = d.profiles?.length
                            ? (d.profiles.find((p) => p.id === localStorage.getItem("dramakan_active_profile_id")) || d.profiles[0])
                            : { avatar: d.avatarUrl || fbAv };
                        const av = prof.avatar || fbAv;
                        const emoji = av.length <= 10 && !av.includes("http") && !av.includes("data:image");

                        const topBtn = $("topAuthBtn"), botBtn = $("bottomAuthBtn");
                        if (topBtn) {
                            topBtn.href = "profile.html";
                            topBtn.classList.add("avatar-only");
                            topBtn.innerHTML = emoji
                                ? `<div style="width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--accent-bright);display:grid;place-items:center;">${av}</div>`
                                : `<img src="${av}" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent-bright);">`;
                        }
                        if (botBtn) {
                            botBtn.href = "profile.html";
                            botBtn.innerHTML = emoji
                                ? `<div style="width:22px;height:22px;border-radius:50%;border:1px solid var(--accent-bright);display:grid;place-items:center;font-size:0.8rem;">${av}</div><span>Profile</span>`
                                : `<img src="${av}" alt="Profile" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--accent-bright);"><span>Profile</span>`;
                        }
                    });
                });
            } catch {}
        }

        // Boot: Sync exact CATS from index.html, then load the requested category
        document.addEventListener("DOMContentLoaded", async () => {
            fillSkels(18);
            initAuth();
            await syncCatalogFromIndex();

            const p = new URLSearchParams(location.search);
            const rawSlug = (p.get("c") || p.get("cat") || p.get("category") || p.get("genre") || "").toLowerCase();
            const matched = rawSlug
                ? (catalog.find((c) => c.slug === rawSlug) || catalog.find((c) => c.slug.includes(rawSlug)))
                : null;

            openCategory(matched || catalog[0], false);
            if (!rawSlug) setDirOpen(true);
        });
    </script>
</body>
</html>
