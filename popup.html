<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Report Issue — Dramakan</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dramakan">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://dramakan.site/og-image.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="feedback-popup.js" defer></script>

    <style>
        :root {
            --rp-surface: #14141a;
            --rp-glass: rgba(24, 24, 30, 0.72);
            --rp-border: rgba(255, 255, 255, 0.14);
            --rp-shine: inset 0 1px 0 rgba(255, 255, 255, 0.2);
            --rp-text: #f5f5f7;
            --rp-muted: #8e8e93;
            --rp-ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Subtle Liquid Glass Floating Pill */
        .report-fab {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 9990;
            height: 40px;
            padding: 0 16px;
            border-radius: 999px;
            background: var(--rp-glass);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--rp-border);
            box-shadow: var(--rp-shine), 0 12px 30px rgba(0, 0, 0, 0.55);
            color: var(--rp-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.22s var(--rp-ease), background 0.2s ease, border-color 0.2s ease;
        }
        .report-fab:hover {
            transform: translateY(-2px);
            background: rgba(36, 36, 44, 0.86);
            border-color: rgba(255, 255, 255, 0.26);
        }
        .report-fab i {
            font-size: 0.86rem;
            color: #fbbf24;
        }

        /* Frosted Modal Backdrop */
        .report-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            padding: 16px;
            background: rgba(0, 0, 0, 0.76);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }
        .report-modal-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Compact Apple Sheet Card */
        .report-modal-card {
            position: relative;
            width: min(370px, 100%);
            padding: 26px 22px 22px;
            border-radius: 24px;
            background: var(--rp-surface);
            border: 1px solid var(--rp-border);
            box-shadow: var(--rp-shine), 0 28px 64px rgba(0, 0, 0, 0.85);
            color: var(--rp-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            transform: scale(0.95) translateY(8px);
            transition: transform 0.28s var(--rp-ease);
        }
        .report-modal-overlay.open .report-modal-card {
            transform: scale(1) translateY(0);
        }

        .report-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--rp-muted);
            font-size: 1.15rem;
            line-height: 1;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .report-modal-close:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .report-icon-badge {
            width: 48px;
            height: 48px;
            margin: 0 auto 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f5f5f7;
            font-size: 1.15rem;
            display: grid;
            place-items: center;
        }

        .report-modal-card h3 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .report-modal-card p {
            margin: 0 0 20px;
            font-size: 0.84rem;
            color: var(--rp-muted);
            line-height: 1.5;
        }

        /* Clean Native Action Rows */
        .report-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .report-action-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: var(--rp-text);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }
        .report-action-btn:hover {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .report-action-btn .ch-ico {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 0.96rem;
            flex-shrink: 0;
        }
        .report-action-btn.telegram .ch-ico {
            background: rgba(42, 171, 238, 0.16);
            color: #38bdf8;
        }
        .report-action-btn.instagram .ch-ico {
            background: rgba(236, 72, 153, 0.16);
            color: #f472b6;
        }
        .report-action-btn .ch-arrow {
            margin-left: auto;
            font-size: 0.72rem;
            color: var(--rp-muted);
        }

        /* Clear the floating mobile bottom bar */
        @media (max-width: 960px) {
            .report-fab {
                right: 14px;
                bottom: 84px;
                height: 38px;
                padding: 0 13px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body style="background:#000;margin:0;">

    <button type="button" id="reportErrorBtn" class="report-fab" title="Report a playback issue" aria-label="Report Issue">
        <i class="fas fa-circle-exclamation"></i>
        <span class="report-text">Report Issue</span>
    </button>

    <div id="reportModal" class="report-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="reportModalTitle">
        <div class="report-modal-card">
            <button type="button" class="report-modal-close" id="closeReportModal" aria-label="Close">&times;</button>

            <div class="report-icon-badge" aria-hidden="true">
                <i class="fas fa-video-slash"></i>
            </div>

            <h3 id="reportModalTitle">Playback Issue?</h3>
            <p>Message us directly with the title and episode number—we'll fix it quickly.</p>

            <div class="report-actions">
                <a href="https://t.me/iamashish6700" target="_blank" rel="noopener noreferrer" class="report-action-btn telegram">
                    <span class="ch-ico"><i class="fab fa-telegram-plane"></i></span>
                    <span>Message on Telegram</span>
                    <i class="fas fa-chevron-right ch-arrow"></i>
                </a>
                <a href="https://instagram.com/YOUR_INSTAGRAM_HERE" target="_blank" rel="noopener noreferrer" class="report-action-btn instagram">
                    <span class="ch-ico"><i class="fab fa-instagram"></i></span>
                    <span>Message on Instagram</span>
                    <i class="fas fa-chevron-right ch-arrow"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";
            const openBtn = document.getElementById("reportErrorBtn");
            const modal = document.getElementById("reportModal");
            const closeBtn = document.getElementById("closeReportModal");
            if (!openBtn || !modal) return;

            const setOpen = (show) => modal.classList.toggle("open", show);

            openBtn.addEventListener("click", () => setOpen(true));
            closeBtn?.addEventListener("click", () => setOpen(false));
            modal.addEventListener("click", (e) => {
                if (e.target === modal) setOpen(false);
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && modal.classList.contains("open")) setOpen(false);
            });
        })();
    </script>
</body>
</html>
