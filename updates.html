<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Updates &amp; Alerts — Dramakan</title>
    <meta name="description" content="Latest announcements, new features, patch notes, and VIP updates from Dramakan.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="feedback-popup.js" defer></script>
    <script type="module" src="global-login-popup.js" defer></script>

    <style>
        :root {
            --bg: #000000;
            --surface: #121216;
            --surface-2: #1c1c22;
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --text: #f5f5f7;
            --muted: #8e8e93;
            --gold: #fbbf24;
            --warn: #f97316;
            --cyan: #38bdf8;
            --glass: rgba(28, 28, 34, 0.64);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-shine: inset 0 1px 0 rgba(255, 255, 255, 0.22);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --pad: clamp(16px, 3.6vw, 48px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            overflow-x: clip;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        img { display: block; }

        .ambient-tint {
            position: fixed;
            inset: 0 0 auto 0;
            height: 44vh;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 65% 80% at 18% 0%, rgba(168, 85, 247, 0.16), transparent 70%),
                radial-gradient(ellipse 55% 70% at 84% 0%, rgba(56, 189, 248, 0.08), transparent 70%);
        }

        /* --- APPLE TV TOP BAR --- */
        .tv-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px var(--pad);
            background: rgba(10, 10, 14, 0.74);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brand { font-size: 1.36rem; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; }
        .brand span { color: var(--accent-bright); }

        .tv-nav-pill {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 4px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
        }
        .tv-nav-pill a {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.83rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.72);
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }
        .tv-nav-pill a:hover { color: #fff; background: rgba(255, 255, 255, 0.09); }
        .tv-nav-pill a.active { background: #fff; color: #000; }

        .header-right { display: flex; align-items: center; gap: 10px; }
        .auth-pill {
            height: 36px;
            padding: 0 15px;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .auth-pill.avatar-only { padding: 0; background: none; }

        .mobile-refresh-pill {
            display: none;
            height: 34px;
            padding: 0 13px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shine);
            font-size: 0.78rem;
            font-weight: 600;
            align-items: center;
            gap: 6px;
        }

        /* --- PAGE SHELL & CONTROLS --- */
        .page-shell { max-width: 920px; margin: 0 auto; padding: 30px var(--pad) 54px; }

        .updates-hero {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }
        .page-title { font-size: clamp(1.75rem, 3.6vw, 2.55rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
        .page-sub { margin-top: 6px; font-size: 0.88rem; color: var(--muted); font-weight: 500; }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .segmented {
            display: inline-flex;
            padding: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.09);
            overflow-x: auto;
            scrollbar-width: none;
            max-width: 100%;
        }
        .segmented::-webkit-scrollbar { display: none; }
        .seg-btn {
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(245, 245, 247, 0.72);
            transition: background 0.18s ease, color 0.18s ease;
            white-space: nowrap;
        }
        .seg-btn.active { background: #fff; color: #000; }

        .pill-btn {
            height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: background 0.18s ease;
            white-space: nowrap;
        }
        .pill-btn:hover { background: rgba(255, 255, 255, 0.16); }

        /* --- UPDATE FEED CARDS --- */
        .notif-list { display: flex; flex-direction: column; gap: 12px; }

        .notif-card {
            width: 100%;
            text-align: left;
            padding: 18px 20px;
            border-radius: 18px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: transform 0.24s var(--ease), background 0.2s ease, border-color 0.2s ease;
        }
        .notif-card:hover {
            transform: translateY(-2px);
            background: var(--surface-2);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .notif-orb {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            background: rgba(168, 85, 247, 0.16);
            color: var(--accent-bright);
            border: 1px solid rgba(192, 132, 252, 0.28);
        }
        .notif-orb.vip { background: rgba(251, 191, 36, 0.14); color: var(--gold); border-color: rgba(251, 191, 36, 0.32); }
        .notif-orb.warn { background: rgba(249, 115, 22, 0.14); color: var(--warn); border-color: rgba(249, 115, 22, 0.32); }
        .notif-orb.patch { background: rgba(56, 189, 248, 0.14); color: var(--cyan); border-color: rgba(56, 189, 248, 0.32); }

        .notif-body-col { flex: 1; min-width: 0; }
        .notif-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
        .notif-title { font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.3; letter-spacing: -0.01em; }
        .notif-time { font-size: 0.74rem; font-weight: 600; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
        .notif-snippet {
            font-size: 0.88rem;
            color: rgba(245, 245, 247, 0.72);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .notif-foot {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-bright);
        }
        .notif-card:hover .notif-foot i { transform: translateX(3px); }
        .notif-foot i { font-size: 0.68rem; transition: transform 0.2s var(--ease); }

        /* Skeletons & Empty State */
        .skel-card {
            height: 112px;
            border-radius: 18px;
            background: linear-gradient(90deg, #121216 25%, #1c1c24 50%, #121216 75%);
            background-size: 200% 100%;
            animation: sk 1.4s ease infinite;
        }
        @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .empty-card {
            padding: 56px 20px;
            border-radius: 22px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .empty-card i { font-size: 2.2rem; color: rgba(255, 255, 255, 0.2); margin-bottom: 4px; }
        .empty-card h3 { font-size: 1.1rem; font-weight: 700; }
        .empty-card p { font-size: 0.86rem; color: var(--muted); }

        /* --- FROSTED DETAIL MODAL --- */
        .modal-bg {
            position: fixed;
            inset: 0;
            z-index: 2500;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-bg.open { display: flex; }
        .modal-card {
            position: relative;
            width: min(600px, 100%);
            max-height: 85dvh;
            overflow-y: auto;
            padding: 26px;
            border-radius: 24px;
            background: #14141a;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), var(--glass-shine);
        }
        .modal-x {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 1.2rem;
            display: grid;
            place-items: center;
        }
        .modal-x:hover { color: #fff; background: rgba(255, 255, 255, 0.16); }
        .modal-title { font-size: 1.32rem; font-weight: 800; letter-spacing: -0.02em; padding-right: 40px; line-height: 1.25; }
        .modal-meta { margin: 8px 0 18px; font-size: 0.78rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
        .modal-body-text { font-size: 0.94rem; color: rgba(245, 245, 247, 0.86); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
        .modal-cta {
            margin-top: 22px;
            height: 42px;
            padding: 0 22px;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 0.86rem;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }
        .modal-cta:hover { opacity: 0.9; }

        .toast {
            position: fixed;
            top: 74px;
            right: var(--pad);
            z-index: 3000;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(28, 28, 34, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            font-size: 0.82rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .bottom-nav, .global-bottom-fade { display: none; }

        @media (max-width: 960px) {
            body { padding-bottom: 92px; }
            .tv-nav-pill, .auth-pill, #refreshDesktopBtn { display: none !important; }
            .mobile-refresh-pill { display: inline-flex; }
            .tv-header { padding: 11px 16px; }
            .page-shell { padding: 18px 16px 32px; }
            .notif-card { padding: 15px; gap: 13px; }
            .notif-orb { width: 40px; height: 40px; border-radius: 12px; font-size: 0.96rem; }
            .notif-top { flex-direction: column; gap: 2px; }

            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 14px;
                left: 50%;
                transform: translateX(-50%);
                width: min(92%, 420px);
                height: 58px;
                padding: 0 8px;
                border-radius: 999px;
                background: rgba(24, 24, 30, 0.78);
                backdrop-filter: blur(26px) saturate(190%);
                -webkit-backdrop-filter: blur(26px) saturate(190%);
                border: 1px solid rgba(255, 255, 255, 0.16);
                box-shadow: var(--glass-shine), 0 18px 40px rgba(0, 0, 0, 0.68);
                z-index: 999;
            }
            .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: rgba(255, 255, 255, 0.56); font-size: 1.08rem; }
            .bottom-nav-item span { font-size: 0.62rem; font-weight: 600; }
            .bottom-nav-item.active { color: #fff; }
            .bottom-nav-item.active i { color: var(--accent-bright); }
            .global-bottom-fade { display: block; position: fixed; inset-inline: 0; bottom: 0; height: 84px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.94), transparent); pointer-events: none; z-index: 990; }
        }
    </style>
</head>

    <!-- DETAIL SHEET MODAL -->

    <script type="module">
        "use strict";

        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const app = getApps().length ? getApp() : initializeApp({
            apiKey: "AIzaSyB7i67_T7fs87BHIY2Pxs6KRAknhXrowIA",
            authDomain: "dramakan007.firebaseapp.com",
            projectId: "dramakan007"
        });
        const db = getFirestore(app);
        const auth = getAuth(app);

        const $ = (id) => document.getElementById(id);
        const listEl = $("page-notifications-list");
        const CACHE_TTL = 3600000;
        let updates = [], activeFilter = "all", toastT = null;

        const toast = (m) => { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2000); };

        function classifyUpdate(title = "") {
            const t = title.toLowerCase();
            if (t.includes("vip") || title.includes("🎉") || title.includes("🎁")) return { kind: "vip", icon: "fa-crown", cls: "vip" };
            if (t.includes("warning") || t.includes("alert") || title.includes("⚠️")) return { kind: "warn", icon: "fa-triangle-exclamation", cls: "warn" };
            if (t.includes("patch") || t.includes("update") || title.includes("🚀")) return { kind: "patch", icon: "fa-rocket", cls: "patch" };
            return { kind: "general", icon: "fa-bullhorn", cls: "" };
        }

        function timeAgo(ts) {
            if (!ts) return "Just now";
            const d = typeof ts === "number" ? new Date(ts) : new Date(ts.toMillis ? ts.toMillis() : ts);
            const sec = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
            const units = [[31536000, "y"], [2592000, "mo"], [86400, "d"], [3600, "h"], [60, "m"]];
            for (const [s, u] of units) if (sec >= s) return `${Math.floor(sec / s)}${u} ago`;
            return "Just now";
        }

        function renderFeed() {
            const items = activeFilter === "all" ? updates : updates.filter((u) => classifyUpdate(u.title).kind === activeFilter);
            $("updatesMeta").textContent = `${updates.length} community ${updates.length === 1 ? "announcement" : "announcements"}`;

            if (!items.length) {
                listEl.innerHTML = `
                    <div class="empty-card">
                        <i class="fas fa-bell-slash"></i>
                        <h3>${activeFilter === "all" ? "No updates yet" : "Nothing in this category"}</h3>
                        <p>Check back soon for new features, drops, and announcements.</p>
                    </div>`;
                return;
            }

            const frag = document.createDocumentFragment();
            items.forEach((n) => {
                const meta = classifyUpdate(n.title);
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "notif-card";
                btn.dataset.openId = n.id;
                btn.innerHTML = `
                    <div class="notif-orb ${meta.cls}"><i class="fas ${meta.icon}"></i></div>
                    <div class="notif-body-col">
                        <div class="notif-top">
                            <h3 class="notif-title"></h3>
                            <span class="notif-time"></span>
                        </div>
                        <p class="notif-snippet"></p>
                        <span class="notif-foot">Read details <i class="fas fa-chevron-right"></i></span>
                    </div>`;
                btn.querySelector(".notif-title").textContent = n.title;
                btn.querySelector(".notif-time").textContent = timeAgo(n.timestamp);
                btn.querySelector(".notif-snippet").textContent = n.body;
                frag.appendChild(btn);
            });
            listEl.innerHTML = "";
            listEl.appendChild(frag);
        }

        function openDetail(id) {
            const n = updates.find((x) => x.id === id);
            if (!n) return;
            $("modal-update-title").textContent = n.title;
            $("modal-update-time").querySelector("span").textContent = timeAgo(n.timestamp);
            $("modal-update-body").textContent = n.body;

            const linkEl = $("modal-update-link");
            const safeLink = n.link && (/^(https?:\/\/|\/|[a-z0-9._-]+\.html)/i).test(n.link.trim()) ? n.link.trim() : "";
            if (safeLink) { linkEl.href = safeLink; linkEl.style.display = "inline-flex"; }
            else linkEl.style.display = "none";

            $("updateModal").classList.add("open");
        }

        async function fetchUpdates(force = false) {
            const now = Date.now();
            if (!force) {
                try {
                    const cached = localStorage.getItem("Dramakan_Community_Cache");
                    const cachedAt = parseInt(localStorage.getItem("Dramakan_Community_Time") || "0", 10);
                    if (cached && now - cachedAt < CACHE_TTL) {
                        updates = JSON.parse(cached);
                        renderFeed();
                        return;
                    }
                } catch {}
            } else {
                listEl.innerHTML = '<div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div>';
            }

            try {
                const snap = await getDocs(query(collection(db, "notifications"), orderBy("createdAt", "desc"), limit(30)));
                updates = [];
                snap.forEach((docSnap) => {
                    const d = docSnap.data();
                    if (d.target === "all" || d.target === "viewers") {
                        const ts = d.createdAt ? (typeof d.createdAt === "number" ? d.createdAt : (d.createdAt.toMillis ? d.createdAt.toMillis() : now)) : now;
                        updates.push({ id: docSnap.id, title: d.title || "Update", body: d.message || d.body || "", link: d.link || "", timestamp: ts });
                    }
                });
                localStorage.setItem("Dramakan_Community_Cache", JSON.stringify(updates));
                localStorage.setItem("Dramakan_Community_Time", String(now));
                renderFeed();
                if (force) toast("Updates refreshed");
            } catch {
                listEl.innerHTML = '<div class="empty-card"><i class="fas fa-wifi"></i><h3>Unable to load updates</h3><p>Check your connection and tap Refresh.</p></div>';
            }
        }

        // Events
        listEl.addEventListener("click", (e) => {
            const card = e.target.closest("[data-open-id]");
            if (card) openDetail(card.dataset.openId);
        });

        $("filterTabs").addEventListener("click", (e) => {
            const b = e.target.closest(".seg-btn");
            if (!b || b.dataset.kind === activeFilter) return;
            document.querySelectorAll("#filterTabs .seg-btn").forEach((x) => x.classList.toggle("active", x === b));
            activeFilter = b.dataset.kind;
            renderFeed();
        });

        $("refreshDesktopBtn").addEventListener("click", () => fetchUpdates(true));
        $("refreshMobileBtn").addEventListener("click", () => fetchUpdates(true));

        const closeModal = () => $("updateModal").classList.remove("open");
        $("closeUpdateBtn").addEventListener("click", closeModal);
        $("updateModal").addEventListener("click", (e) => { if (e.target.id === "updateModal") closeModal(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

        // Instant fetch + passive mark-as-read + avatar sync
        fetchUpdates(false);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                localStorage.setItem("Anykan_Last_Read", String(Date.now()));
                return;
            }
            const ref = doc(db, "users", user.uid);
            updateDoc(ref, { lastReadTime: Date.now() }).catch(() => {});

            try {
                const snap = await getDoc(ref);
                if (!snap.exists()) return;
                const d = snap.data();
                const fallback = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(user.displayName || user.email || "U")}`;
                const prof = d.profiles?.length
                    ? (d.profiles.find((p) => p.id === localStorage.getItem("dramakan_active_profile_id")) || d.profiles[0])
                    : { avatar: d.avatarUrl || user.photoURL || fallback };
                const av = prof.avatar || fallback;
                const emoji = av.length <= 10 && !av.includes("http") && !av.includes("data:image");

                const topBtn = $("topAuthBtn"), botBtn = $("bottomAuthBtn");
                if (topBtn) {
                    topBtn.href = "profile.html";
                    topBtn.classList.add("avatar-only");
                    topBtn.innerHTML = emoji
                        ? `<div style="width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--accent-bright);display:grid;place-items:center;">${av}</div>`
                        : `<img src="${av}" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent-bright);">`;
                }
                if (botBtn) {
                    botBtn.href = "profile.html";
                    botBtn.innerHTML = emoji
                        ? `<div style="width:22px;height:22px;border-radius:50%;border:1px solid var(--accent-bright);display:grid;place-items:center;font-size:0.8rem;">${av}</div><span>Profile</span>`
                        : `<img src="${av}" alt="Profile" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--accent-bright);"><span>Profile</span>`;
                }
            } catch {}
        });
    </script>
</body>
</html>
