<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="admin_easter_egg.js" defer></script>
    <script type="module" src="global-login-popup.js" defer></script>

    <style>
        /* =========================================
           MY LIST SPECIFIC OVERRIDES
        ========================================= */
        main { padding-top: 110px; min-height: 80vh; }
        
        .page-header-banner {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: slideUp 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        .header-content { display: flex; align-items: center; gap: 20px; }
        .header-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary-color), #6a1b9a);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #fff; box-shadow: 0 10px 25px var(--primary-glow);
        }
        .page-title { font-size: 2rem; font-weight: 800; color: #fff; margin: 0 0 5px 0; }
        .page-subtitle { color: var(--text-muted-color); font-size: 0.95rem; margin: 0; }
        
        .list-stats {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 12px 25px;
            border-radius: 16px; text-align: center;
        }
        .stat-num { display: block; font-size: 1.8rem; font-weight: 700; color: var(--primary-color); line-height: 1; margin-bottom: 4px;}
        .stat-label { font-size: 0.75rem; color: var(--text-muted-color); font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

        /* Grid Alignment (Matching DramaKan Standard) */
        .my-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }
        
        /* Red Delete Button Override */
        .bookmark-btn.delete-btn {
            background: rgba(239, 68, 68, 0.8) !important; 
            border-color: #ef4444 !important; 
        }
        .bookmark-btn.delete-btn:hover {
            background: #ef4444 !important;
            transform: scale(1.15);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
        }

        /* States */
        .empty-state, .loading-state { 
            grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px; background: var(--glass-bg); border: 1px dashed var(--glass-border-light); 
            border-radius: 20px; backdrop-filter: var(--glass-blur); text-align: center;
        }
        .empty-icon { width: 90px; height: 90px; background: rgba(138, 43, 226, 0.1); color: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 20px; border: 1px solid rgba(138, 43, 226, 0.3); }
        .empty-state h3 { font-size: 1.4rem; font-weight: 700; color: #fff; margin: 0 0 10px 0; }
        .empty-state p { color: var(--text-muted-color); font-size: 0.95rem; margin: 0 0 25px 0; max-width: 400px; line-height: 1.6;}
        .btn-browse { background: var(--primary-color); color: #fff; padding: 12px 30px; border-radius: 50px; font-weight: 600; transition: 0.3s; box-shadow: 0 10px 25px var(--primary-glow); display: inline-flex; align-items: center; gap: 8px;}
        .btn-browse:hover { transform: translateY(-3px); background: #9d4edd; }
        
        .loading-state i { font-size: 3rem; color: var(--primary-color); margin-bottom: 15px; }

        /* Mobile Layout */
        @media (max-width: 992px) {
            main { padding-top: 100px; }
            .page-header-banner { flex-direction: column; align-items: flex-start; gap: 20px; padding: 25px;}
            .list-stats { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;}
            .stat-num { font-size: 1.5rem; margin-bottom: 0; }
        }
        @media (max-width: 768px) {
            /* Exact match to mobile drama cards in indexstyle.css */
            .my-list-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; }
            .page-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">Drama<span>Kan</span></a>
            </div>

        <div class="mobile-search-container">
            <div class="mobile-glass-search">
                <i class="fas fa-search"></i>
                <input id="mobileSearchInput" type="text" placeholder="Search movies, shows, anime...">
                <a href="filter.html" class="search-filter-link"><i class="fas fa-sliders-h"></i></a>
            </div>
            <div id="mobileSearchResults" class="search-results mobile-search-results-dropdown"></div>
        </div>
    </header>

    <aside class="ott-sidebar">
        <ul class="sidebar-links">
            <li class="sidebar-item">
                <a href="profile.html" class="sidebar-link" title="My Space">
                    <i class="fa-solid fa-user-circle"></i>
                    <span class="sidebar-text">My Space</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link" title="Home">
                    <i class="fa-solid fa-house"></i>
                    <span class="sidebar-text">Home</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="shows.html" class="sidebar-link" title="TV Shows">
                    <i class="fa-solid fa-tv"></i>
                    <span class="sidebar-text">TV Shows</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="movies.html" class="sidebar-link" title="Movies">
                    <i class="fa-solid fa-film"></i>
                    <span class="sidebar-text">Movies</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="anime.html" class="sidebar-link" title="Anime">
                    <i class="fa-solid fa-dragon"></i>
                    <span class="sidebar-text">Anime</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="asian.html" class="sidebar-link" title="Asian">
                    <i class="fa-solid fa-theater-masks"></i>
                    <span class="sidebar-text">Asian</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="mylist.html" class="sidebar-link active" title="My List">
                    <i class="fa-solid fa-bookmark"></i>
                    <span class="sidebar-text">My List</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-bottom">
            <a href="https://AnyKan.fun" class="sidebar-link switch-kan" title="Switch to Anykan">
                <i class="fas fa-exchange-alt"></i>
                <span class="sidebar-text">Anykan</span>
            </a>
        </div>
    </aside>

    <main class="container">
        <div class="page-header-banner">
            <div class="header-content">
                <div class="header-icon"><i class="fas fa-bookmark"></i></div>
                <div>
                    <h1 class="page-title">My List</h1>
                    <p class="page-subtitle">Your personal collection of saved dramas.</p>
                </div>
            </div>
            <div class="list-stats">
                <span class="stat-num" id="total-count">0</span>
                <span class="stat-label">Saved Items</span>
            </div>
        </div>

        <div class="my-list-grid" id="mylist-grid-container">
            <div class="loading-state" id="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                <h3 style="color:#fff; margin:0;">Syncing with Cloud...</h3>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house nav-icon"></i>
            <span class="nav-label">Home</span>
        </a>
       <a href="community.html" class="bottom-nav-item">
            <i class="fa-solid fa-bell nav-icon"></i>
            <span class="nav-label">Updates</span>
        </a>
        <a href="mylist.html" class="bottom-nav-item active">
            <i class="fa-solid fa-bookmark nav-icon"></i>
            <span class="nav-label">My List</span>
        </a>
        <a href="profile.html" class="bottom-nav-item" id="bottomAuthBtn">
            <i class="fa-solid fa-user nav-icon"></i>
            <span class="nav-label">Profile</span>
        </a>
    </nav>
    
    <!-- Smooth Bottom Overlay Fade -->
    <div class="global-bottom-fade"></div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB7i67_T7fs87BHIY2Pxs6KRAknhXrowIA", authDomain: "dramakan007.firebaseapp.com", projectId: "dramakan007" };
        
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp(); 
        const auth = getAuth(app); 
        const db = getFirestore(app);

        let currentUserDocRef = null;
        let currentMyList = [];
        let userProfiles = [];
        let activeProfileIndex = 0;
        let unsubscribeList = null;

        // Render Logic applying the standard .drama-card structure
        window.renderMyList = function(listArray) {
            const myListGrid = document.getElementById('mylist-grid-container');
            const totalCountEl = document.getElementById('total-count');
            
            totalCountEl.textContent = listArray ? listArray.length : 0;

            if (listArray && listArray.length > 0) {
                myListGrid.innerHTML = listArray.slice().reverse().map(item => {
                    const identifier = item.id || item.link; 
                    const d = new Date(item.timestamp || Date.now());
                    const dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                    
                    return `
                    <div class="drama-card" style="aspect-ratio: 2/3;">
                        <a href="${item.link}" style="display:block; height:100%; width:100%;">
                            <div class="drama-card-img">
                                <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.src='default-poster.jpg'">
                            </div>
                            <div class="drama-card-info" style="opacity: 1; padding: 15px 10px 10px; background: linear-gradient(to top, rgba(0,0,0,1) 30%, transparent);">
                                <h3 class="drama-card-title">${item.title}</h3>
                                <p class="drama-card-meta" style="font-size: 0.65rem; color: var(--text-muted-color);">Added ${dateStr}</p>
                            </div>
                        </a>
                        <button class="bookmark-btn active delete-btn" onclick="event.preventDefault(); event.stopPropagation(); window.removeFromMyList('${identifier}')" title="Remove from My List">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `}).join('');
            } else {
                myListGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-bookmark"></i></div>
                        <h3>Your list is looking empty</h3>
                        <p>Discover amazing Korean, Chinese, and Japanese dramas and tap the + button to save them for later.</p>
                        <a href="index.html" class="btn-browse"><i class="fas fa-compass"></i> Explore Dramas</a>
                    </div>`;
            }
        };

        // Cloud-Sync Remove Function
        window.removeFromMyList = async function(id) {
            if (!currentUserDocRef) return;
            
            const updatedList = currentMyList.filter(item => String(item.id) !== String(id) && item.link !== id);
            
            try {
                if (userProfiles && userProfiles.length > 0) {
                    userProfiles[activeProfileIndex].myList = updatedList;
                    await updateDoc(currentUserDocRef, { profiles: userProfiles });
                } else {
                    await updateDoc(currentUserDocRef, { myList: updatedList });
                }
            } catch (error) { 
                console.error("Error removing item:", error); 
                alert("Failed to remove item. Please check your connection."); 
            }
        };

        // Real-time Cloud Sync Engine
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserDocRef = doc(db, "users", user.uid);
                
                if(unsubscribeList) unsubscribeList();
                
                unsubscribeList = onSnapshot(currentUserDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        if (data.profiles && data.profiles.length > 0) {
                            userProfiles = data.profiles;
                            const savedProfileId = localStorage.getItem('dramakan_active_profile_id');
                            
                            activeProfileIndex = userProfiles.findIndex(p => p.id === savedProfileId);
                            if (activeProfileIndex === -1) activeProfileIndex = 0;
                            
                            currentMyList = userProfiles[activeProfileIndex].myList || [];
                        } else {
                            currentMyList = data.myList || [];
                        }

                        // ID Sanitizer logic
                        currentMyList = currentMyList.map(item => {
                            if(!item.id && item.link) {
                                const urlParams = new URLSearchParams(item.link.split('?')[1]);
                                item.id = String(urlParams.get('id'));
                            } else if (item.id) {
                                item.id = String(item.id);
                            }
                            return item;
                        });

                        // Passive backup to local storage for instant loads
                        if (activeProfileIndex === 0) {
                            localStorage.setItem('dramakan_mylist', JSON.stringify(currentMyList));
                            let watchlistObj = {};
                            currentMyList.forEach(item => { if(item.id) watchlistObj[item.id] = item; });
                            localStorage.setItem('dramakan_watchlist', JSON.stringify(watchlistObj));
                        }

                        renderMyList(currentMyList);
                    } else {
                        renderMyList([]);
                    }
                }, (error) => {
                    document.getElementById('mylist-grid-container').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon" style="color: #ef4444; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3);"><i class="fas fa-exclamation-triangle"></i></div>
                            <h3>Connection Error</h3>
                            <p>We couldn't reach the servers. Retrying...</p>
                        </div>`;
                });

            } else {
                window.location.replace('login.html'); 
            }
        });
        
        // Search bar mapping function (For UI functionality completeness)
        document.addEventListener('DOMContentLoaded', () => {
            const mSearch = document.getElementById('mobileSearchInput');
            const pcSearch = document.getElementById('searchInput');
            if(mSearch && pcSearch) {
                mSearch.addEventListener('input', (e) => {
                    pcSearch.value = e.target.value;
                    pcSearch.dispatchEvent(new Event('input')); 
                });
            }
        });
    </script>
</body>
</html>
