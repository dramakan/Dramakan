<style>
    html.dk-loader-lock,
    html.dk-loader-lock body {
        overflow: hidden !important;
    }

    #loader-wrapper {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #000000;
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                    filter 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform, filter;
    }

    #loader-wrapper.dk-loader-exit {
        opacity: 0;
        transform: scale(1.06);
        filter: blur(14px);
        pointer-events: none;
    }

    /* Drifting Liquid Caustic Orbs */
    .dk-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(72px);
        opacity: 0.42;
        pointer-events: none;
        will-change: transform;
    }
    .dk-orb-1 {
        width: min(56vw, 460px);
        height: min(56vw, 460px);
        background: radial-gradient(circle, #a855f7 0%, #6d28d9 52%, transparent 72%);
        transform: translate3d(-24%, -18%, 0);
        animation: dkOrbA 7s ease-in-out infinite alternate;
    }
    .dk-orb-2 {
        width: min(48vw, 390px);
        height: min(48vw, 390px);
        background: radial-gradient(circle, #c084fc 0%, #38bdf8 48%, transparent 72%);
        transform: translate3d(26%, 22%, 0);
        animation: dkOrbB 8.5s ease-in-out infinite alternate;
    }
    @keyframes dkOrbA {
        to { transform: translate3d(18%, 14%, 0) scale(1.12); }
    }
    @keyframes dkOrbB {
        to { transform: translate3d(-20%, -16%, 0) scale(0.92); }
    }

    /* Apple Liquid Glass Capsule */
    .loader-glass-lens {
        position: relative;
        width: min(440px, 92vw);
        padding: clamp(32px, 6vw, 48px) clamp(24px, 5vw, 44px) clamp(26px, 5vw, 36px);
        border-radius: 32px;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.12) 0%, rgba(24, 24, 34, 0.56) 52%, rgba(12, 12, 18, 0.72) 100%);
        backdrop-filter: blur(32px) saturate(190%);
        -webkit-backdrop-filter: blur(32px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
            0 32px 80px rgba(0, 0, 0, 0.78),
            inset 0 1px 0 rgba(255, 255, 255, 0.34),
            inset 0 -1px 0 rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        overflow: hidden;
        isolation: isolate;
    }

    /* Specular Rotating Liquid Rim */
    .loader-glass-lens::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1.5px;
        background: conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255, 255, 255, 0.65) 45deg,
            rgba(192, 132, 252, 0.8) 90deg,
            transparent 150deg,
            transparent 240deg,
            rgba(255, 255, 255, 0.35) 300deg,
            transparent 360deg
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: dkRimSpin 5s linear infinite;
        pointer-events: none;
    }
    @keyframes dkRimSpin {
        to { transform: rotate(360deg); }
    }

    /* Glossy Glass Sheen Sweep */
    .loader-glass-lens::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 28%, rgba(255, 255, 255, 0.11) 48%, transparent 66%);
        transform: translateX(-120%);
        animation: dkSheen 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        pointer-events: none;
    }
    @keyframes dkSheen {
        0%, 20% { transform: translateX(-120%); }
        80%, 100% { transform: translateX(130%); }
    }

    /* Liquid Fill Wordmark */
    .loader-wordmark {
        position: relative;
        display: inline-block;
        user-select: none;
    }
    .loader-text-bg,
    .loader-text-fg {
        font-size: clamp(2.8rem, 11vw, 4.4rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
        margin: 0;
        white-space: nowrap;
    }
    .loader-text-bg {
        color: rgba(255, 255, 255, 0.14);
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.16);
    }
    .loader-text-fg {
        position: absolute;
        inset: 0;
        color: #f5f5f7;
        clip-path: inset(100% 0 0 0);
        filter: drop-shadow(0 0 22px rgba(192, 132, 252, 0.42));
        will-change: clip-path;
    }
    .loader-text-fg span {
        background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 48%, #a855f7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    /* Liquid Mercury Progress Track */
    .loader-meter {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .loader-track {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        overflow: hidden;
    }
    .loader-fill {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a855f7 0%, #c084fc 55%, #ffffff 100%);
        box-shadow: 0 0 16px rgba(192, 132, 252, 0.75);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
    }

    .loader-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(245, 245, 247, 0.56);
    }
    #loader-percentage {
        font-variant-numeric: tabular-nums;
        color: rgba(245, 245, 247, 0.88);
        font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
        .dk-orb, .loader-glass-lens::before, .loader-glass-lens::after { animation: none; }
    }
</style>

<div id="loader-wrapper" role="status" aria-live="polite" aria-label="Loading DramaKan">
    <div class="dk-orb dk-orb-1" aria-hidden="true"></div>
    <div class="dk-orb dk-orb-2" aria-hidden="true"></div>

    <div class="loader-glass-lens">
        <div class="loader-wordmark">
            <h1 class="loader-text-bg">Drama<span>Kan</span></h1>
            <h1 class="loader-text-fg" id="loader-text-fg" aria-hidden="true">Drama<span>Kan</span></h1>
        </div>

        <div class="loader-meter">
            <div class="loader-track">
                <div class="loader-fill" id="loader-bar-fill"></div>
            </div>
            <div class="loader-meta">
                <span id="loader-status">Initializing</span>
                <span id="loader-percentage">0%</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        "use strict";
        document.documentElement.classList.add("dk-loader-lock");

        const initLoader = () => {
            const wrapper = document.getElementById("loader-wrapper");
            const fg = document.getElementById("loader-text-fg");
            const fill = document.getElementById("loader-bar-fill");
            const pctEl = document.getElementById("loader-percentage");
            const statusEl = document.getElementById("loader-status");
            const pageContent = document.getElementById("page-content");
            if (!wrapper || !fg || !fill || !pctEl) return;

            const DURATION = 1850;
            const start = performance.now();

            const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -9 * t));

            const step = (now) => {
                const raw = Math.min((now - start) / DURATION, 1);
                const eased = easeOutExpo(raw);
                const pct = Math.round(eased * 100);

                fg.style.clipPath = `inset(${100 - eased * 100}% 0 0 0)`;
                fill.style.transform = `scaleX(${eased})`;
                pctEl.textContent = `${pct}%`;

                if (statusEl) {
                    statusEl.textContent = pct < 40 ? "Initializing" : pct < 85 ? "Loading Library" : "Ready";
                }

                if (raw < 1) {
                    requestAnimationFrame(step);
                } else {
                    setTimeout(() => {
                        if (pageContent) pageContent.style.display = "block";
                        wrapper.classList.add("dk-loader-exit");
                        document.documentElement.classList.remove("dk-loader-lock");

                        setTimeout(() => {
                            wrapper.style.display = "none";
                        }, 680);
                    }, 180);
                }
            };

            requestAnimationFrame(step);
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initLoader, { once: true });
        } else {
            initLoader();
        }
    })();
</script>
