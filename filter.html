<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Explore & Filter - Dramakan</title>
    
    <meta name="title" content="Dramakan - Discover Movies, TV Shows, Anime & Dramas Online">
    <meta name="description" content="Discover and filter your favorite Movies, Asian Dramas, TV Series, and Anime by genre, year, language, and popularity on Dramakan.">
    <meta name="theme-color" content="#9D4EDD">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="bottom-bar.js" defer></script>
    <script src="feedback-popup.js" defer></script>
    <script src="admin_easter_egg.js" defer></script>

    <style>
        :root {
            --primary: #9D4EDD;
            --primary-rich: #7b2cbf;
            --primary-glow: rgba(157, 78, 221, 0.4);
            
            --bg-void: #060709;
            --bg-surface: rgba(20, 20, 28, 0.55);
            --bg-sidebar: rgba(16, 16, 24, 0.85);
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(25px);
            --star-gold: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-void); 
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 78, 221, 0.08), transparent 35%),
                radial-gradient(circle at 90% 70%, rgba(59, 130, 246, 0.05), transparent 35%);
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }
        button { border: none; background: transparent; font-family: inherit; cursor: pointer; outline: none; }

        /* Header */
        .main-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(6, 7, 9, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 5%; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .back-home { 
            color: var(--text-muted); font-weight: 600; font-size: 0.9rem; transition: 0.3s; 
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; 
            border-radius: 50px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
        }
        .back-home:hover { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

        /* Layout */
        .filter-page-container {
            display: flex; gap: 32px; padding: 35px 5%; max-width: 1600px; margin: 0 auto; min-height: 100vh;
        }

        /* Sidebar Filters */
        .filter-sidebar {
            width: 300px; flex-shrink: 0; background: var(--bg-sidebar); 
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 24px; height: calc(100vh - 120px); position: sticky; top: 90px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .filter-sidebar::-webkit-scrollbar { width: 5px; }
        .filter-sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .filter-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); 
        }
        .filter-header h2 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .filter-header h2 i { color: var(--primary); }

        .filter-group { margin-bottom: 24px; }
        .filter-group h3 { 
            font-size: 0.8rem; margin-bottom: 12px; color: var(--text-muted); 
            font-weight: 700; letter-spacing: 1px; text-transform: uppercase; 
        }

        /* Category Chips Selector */
        .category-pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .category-pill {
            padding: 8px 14px; border-radius: 12px; font-size: 0.82rem; font-weight: 600;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }
        .category-pill:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .category-pill.active { 
            background: linear-gradient(135deg, var(--primary), var(--primary-rich)); 
            color: #fff; border-color: var(--primary); box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Checkbox & Radio lists */
        .checkbox-list { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; padding-right: 5px; scrollbar-width: thin;}
        .checkbox-list label { 
            display: flex; align-items: center; gap: 10px; font-size: 0.88rem; 
            color: #CBD5E1; cursor: pointer; transition: 0.2s; user-select: none;
        }
        .checkbox-list label:hover { color: #fff; }
        
        .checkbox-list input[type="checkbox"], .checkbox-list input[type="radio"] {
            appearance: none; -webkit-appearance: none;
            width: 18px; height: 18px; border: 2px solid var(--glass-border-light);
            border-radius: 5px; background: rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.25s ease; position: relative; flex-shrink: 0;
        }
        .checkbox-list input[type="radio"] { border-radius: 50%; }
        .checkbox-list input:checked { 
            background: var(--primary); border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); 
        }
        .checkbox-list input[type="checkbox"]:checked::after { 
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; font-size: 10px; color: white; 
        }
        .checkbox-list input[type="radio"]:checked::after { 
            content: ''; width: 6px; height: 6px; background: white; border-radius: 50%; 
        }

        /* Select styling */
        .custom-select {
            width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border-light);
            color: #fff; border-radius: 12px; font-family: inherit; font-size: 0.88rem; outline: none; cursor: pointer;
            transition: 0.3s; appearance: none;
        }
        .custom-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.2); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { 
            content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900; 
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); 
            color: var(--text-muted); pointer-events: none; 
        }
        .custom-select option { background: #0E0F14; color: #fff; }

        .btn-clear {
            width: 100%; padding: 13px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 15px; font-size: 0.88rem;
        }
        .btn-clear:hover { background: #ef4444; color: #fff; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35); transform: translateY(-2px); }

        /* Results Display */
        .results-section { flex: 1; min-width: 0; }
        .results-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            margin-bottom: 25px; flex-wrap: wrap; gap: 10px;
        }
        .results-title { font-size: 1.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.5px;}
        .results-count { color: var(--text-muted); font-size: 0.9rem; font-weight: 500;}

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
        }

        /* Movie / Series Universal Cards */
        .media-card {
            position: relative; border-radius: 16px; overflow: hidden; background: #121318;
            aspect-ratio: 2/3; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--glass-border); opacity: 0; transform: translateY(20px);
            display: flex; flex-direction: column; text-decoration: none;
        }
        .media-card.loaded { opacity: 1; transform: translateY(0); }
        .media-card:hover { 
            transform: translateY(-7px); border-color: rgba(157, 78, 221, 0.6); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(157, 78, 221, 0.2);
        }
        
        .media-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .media-card:hover img { transform: scale(1.06); }

        .card-overlay {
            position: absolute; inset: 0; 
            background: linear-gradient(0deg, rgba(8,9,12,0.95) 0%, rgba(8,9,12,0.35) 45%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
        }
        
        .badge-rating { 
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); 
            padding: 4px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: var(--star-gold); 
            display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.12); 
        }
        .badge-type {
            position: absolute; top: 10px; left: 10px; background: rgba(157, 78, 221, 0.85); 
            padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; color: #fff; 
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .card-title { 
            font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 4px; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;
        }
        .card-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
        
        .play-overlay-btn {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0.7);
            width: 46px; height: 46px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #fff;
            opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px var(--primary-glow); z-index: 2;
        }
        .media-card:hover .play-overlay-btn { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Spinners & Empty states */
        .infinite-spinner { 
            grid-column: 1 / -1; display: flex; justify-content: center; padding: 40px 0; 
            opacity: 0; transition: opacity 0.3s; 
        }
        .infinite-spinner.active { opacity: 1; }
        .infinite-spinner i { font-size: 2.2rem; color: var(--primary); animation: spin 1s linear infinite; }
        
        .empty-state { 
            grid-column: 1 / -1; text-align: center; padding: 70px 20px; 
            background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px dashed var(--glass-border); 
        }
        .empty-state i { font-size: 3rem; color: var(--text-muted); margin-bottom: 15px; opacity: 0.4; }
        .empty-state h3 { font-size: 1.25rem; color: #fff; margin-bottom: 6px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Mobile Floating Filter Triggers */
        .mobile-filter-btn {
            display: none; position: fixed; bottom: 85px; right: 20px; z-index: 990;
            background: linear-gradient(135deg, var(--primary), var(--primary-rich)); 
            color: #fff; padding: 14px 24px; border-radius: 50px;
            font-size: 0.95rem; font-weight: 700; box-shadow: 0 10px 25px var(--primary-glow);
            align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2);
        }
        .close-filter-btn { 
            display: none; background: rgba(255,255,255,0.08); width: 36px; height: 36px; 
            border-radius: 50%; color: #fff; align-items: center; justify-content: center; 
        }

        /* Responsive Optimization */
        @media (max-width: 992px) {
            .filter-page-container { flex-direction: column; padding: 20px 4%; gap: 20px; }
            .results-header { margin-bottom: 20px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
            .mobile-filter-btn { display: flex; }
            
            .filter-sidebar {
                position: fixed; top: 0; left: -110%; width: 85%; max-width: 340px; height: 100vh;
                z-index: 2000; border-radius: 0; border: none; border-right: 1px solid var(--glass-border);
                overflow-y: auto; box-shadow: 20px 0 50px rgba(0,0,0,0.8);
                transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .filter-sidebar.active { left: 0; }
            .close-filter-btn { display: flex; }
            
            .overlay { 
                position: fixed; inset: 0; background: rgba(0,0,0,0.75); 
                backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
                z-index: 1999; opacity: 0; pointer-events: none; transition: 0.3s; 
            }
            .overlay.active { opacity: 1; pointer-events: auto; }
            
            body { padding-bottom: 90px; }
        }

        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-title { font-size: 0.85rem; }
            .results-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo">Drama<span>Kan</span></a>
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Home</a>
    </header>

    <div class="overlay" id="mobile-overlay"></div>
    <button class="mobile-filter-btn" id="mobile-filter-btn"><i class="fas fa-filter"></i> Refine Search</button>

    <main class="filter-page-container">
        
        <aside class="filter-sidebar" id="sidebar">
            <div class="filter-header">
                <h2><i class="fas fa-sliders-h"></i> Filters</h2>
                <button class="close-filter-btn" id="close-sidebar"><i class="fas fa-times"></i></button>
            </div>

            <div class="filter-group">
                <h3>Category</h3>
                <div class="category-pill-group" id="category-filters">
                    <button class="category-pill active" data-category="all">All</button>
                    <button class="category-pill" data-category="drama">Asian Drama</button>
                    <button class="category-pill" data-category="movie">Movies</button>
                    <button class="category-pill" data-category="tv">TV Shows</button>
                    <button class="category-pill" data-category="anime">Anime</button>
                </div>
            </div>

            <div class="filter-group">
                <h3>Sort Order</h3>
                <div class="select-wrapper">
                    <select class="custom-select" id="sort-select">
                        <option value="popularity.desc">Most Popular</option>
                        <option value="vote_average.desc">Highest Rated</option>
                        <option value="first_air_date.desc">Newest Releases</option>
                        <option value="vote_count.desc">Most Voted</option>
                    </select>
                </div>
            </div>

            <div class="filter-group">
                <h3>Region / Language</h3>
                <div class="checkbox-list">
                    <label><input type="radio" name="lang" value="" checked> All Languages</label>
                    <label><input type="radio" name="lang" value="ko"> Korean (K-Drama / Korean)</label>
                    <label><input type="radio" name="lang" value="ja"> Japanese (Anime / Japanese)</label>
                    <label><input type="radio" name="lang" value="zh"> Chinese (C-Drama / Mandarin)</label>
                    <label><input type="radio" name="lang" value="en"> English (Global / Hollywood)</label>
                    <label><input type="radio" name="lang" value="hi"> Hindi (Indian / Bollywood)</label>
                    <label><input type="radio" name="lang" value="th"> Thai (Thai Drama)</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>Genres</h3>
                <div class="checkbox-list" id="genre-filters">
                    <label><input type="checkbox" value="28|10759"> Action & Adventure</label>
                    <label><input type="checkbox" value="10749|10766"> Romance & Soap</label>
                    <label><input type="checkbox" value="35"> Comedy</label>
                    <label><input type="checkbox" value="18"> Drama</label>
                    <label><input type="checkbox" value="878|14|10765"> Sci-Fi & Fantasy</label>
                    <label><input type="checkbox" value="9648|53"> Mystery & Thriller</label>
                    <label><input type="checkbox" value="27"> Horror</label>
                    <label><input type="checkbox" value="16"> Animation</label>
                    <label><input type="checkbox" value="80"> Crime</label>
                    <label><input type="checkbox" value="10751|10762"> Family & Kids</label>
                    <label><input type="checkbox" value="36|10752|10768"> History & War</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>Release Year</h3>
                <div class="select-wrapper">
                    <select class="custom-select" id="year-select">
                        <option value="">Any Year</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2010s">2010 - 2019</option>
                        <option value="2000s">2000 - 2009</option>
                        <option value="older">1999 & Older</option>
                    </select>
                </div>
            </div>

            <button class="btn-clear" id="reset-filters"><i class="fas fa-rotate-left"></i> Reset All Filters</button>
        </aside>

        <section class="results-section">
            <div class="results-header">
                <h1 class="results-title" id="display-category-title">Discover All Content</h1>
                <span class="results-count" id="results-count">Loading titles...</span>
            </div>
            
            <div class="grid-container" id="results-grid"></div>
            
            <div class="infinite-spinner" id="loading-spinner">
                <i class="fas fa-circle-notch"></i>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tmdbKey = "hidden_by_proxy";
            
            let currentPage = 1;
            let totalPages = 1;
            let isFetching = false;
            let currentResults = 0;
            let activeCategory = 'all';

            const grid = document.getElementById('results-grid');
            const spinner = document.getElementById('loading-spinner');
            const countLabel = document.getElementById('results-count');
            const displayTitle = document.getElementById('display-category-title');
            
            const categoryBtns = document.querySelectorAll('.category-pill');
            const sortSelect = document.getElementById('sort-select');
            const langRadios = document.querySelectorAll('input[name="lang"]');
            const genreCheckboxes = document.querySelectorAll('#genre-filters input[type="checkbox"]');
            const yearSelect = document.getElementById('year-select');
            const resetBtn = document.getElementById('reset-filters');

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const mobileBtn = document.getElementById('mobile-filter-btn');
            const closeBtn = document.getElementById('close-sidebar');

            // Category Selection Logic
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeCategory = btn.getAttribute('data-category');
                    
                    const titles = {
                        all: "Discover All Content",
                        drama: "Explore Asian Dramas",
                        movie: "Explore Movies",
                        tv: "Explore TV Series",
                        anime: "Explore Anime"
                    };
                    displayTitle.textContent = titles[activeCategory] || "Discover Content";
                    fetchContent(false);
                });
            });

            // Universal Fetcher across Movies, Shows, Anime, and Asian Dramas
            async function fetchContent(isLoadMore = false) {
                if (isFetching) return;
                if (!isLoadMore) {
                    currentPage = 1;
                    grid.innerHTML = '';
                    currentResults = 0;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

                isFetching = true;
                spinner.classList.add('active');

                const sortBy = sortSelect.value;
                const lang = document.querySelector('input[name="lang"]:checked').value;
                const year = yearSelect.value;
                
                const selectedGenres = Array.from(genreCheckboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.value)
                    .join('|');

                // Determine whether to call movie, tv, or both
                let targetType = 'tv';
                if (activeCategory === 'movie') targetType = 'movie';
                else if (activeCategory === 'tv') targetType = 'tv';
                else if (activeCategory === 'all') targetType = (currentPage % 2 === 0) ? 'movie' : 'tv';

                let url = `https://dramakan-tmdb-proxy.zabaazcreations.workers.dev//3/discover/${targetType}?api_key=${tmdbKey}&page=${currentPage}&vote_count.gte=5`;

                // Handle Sort Field Differences between Movies and TV
                let sortParam = sortBy;
                if (targetType === 'movie' && sortBy.includes('first_air_date')) {
                    sortParam = sortBy.replace('first_air_date', 'primary_release_date');
                }
                url += `&sort_by=${sortParam}`;

                // Handle Category-Specific Preset Rules
                if (activeCategory === 'drama') {
                    url += `&with_original_language=${lang || 'ko|zh|ja|th'}&without_genres=16`;
                } else if (activeCategory === 'anime') {
                    url += `&with_genres=16&with_original_language=${lang || 'ja'}`;
                } else {
                    if (lang) url += `&with_original_language=${lang}`;
                    if (selectedGenres) url += `&with_genres=${selectedGenres}`;
                }

                // Handle Release Year Parameters
                if (year) {
                    const datePrefix = (targetType === 'movie') ? 'primary_release_date' : 'first_air_date';
                    if (year === '2010s') {
                        url += `&${datePrefix}.gte=2010-01-01&${datePrefix}.lte=2019-12-31`;
                    } else if (year === '2000s') {
                        url += `&${datePrefix}.gte=2000-01-01&${datePrefix}.lte=2009-12-31`;
                    } else if (year === 'older') {
                        url += `&${datePrefix}.lte=1999-12-31`;
                    } else {
                        url += (targetType === 'movie') ? `&primary_release_year=${year}` : `&first_air_date_year=${year}`;
                    }
                }

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("TMDB Error");
                    const data = await response.json();
                    
                    totalPages = data.total_pages || 1;
                    const validItems = (data.results || []).filter(item => item.poster_path);
                    currentResults += validItems.length;
                    
                    renderCards(validItems, targetType, isLoadMore);
                    countLabel.innerHTML = `Showing <strong style="color:#fff">${currentResults}</strong> of ${(data.total_results || currentResults).toLocaleString()} titles`;
                    
                    if (validItems.length === 0 && !isLoadMore) {
                        grid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-film"></i>
                                <h3>No Content Found</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">Try adjusting your genre, year, or region filters.</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error("Filter Fetch Error:", error);
                    if (!isLoadMore) {
                        grid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-triangle-exclamation" style="color:#ef4444;"></i>
                                <h3>Unable to Load Titles</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">Please check your connection and try again.</p>
                            </div>
                        `;
                    }
                } finally {
                    isFetching = false;
                    spinner.classList.remove('active');
                }
            }

            // Universal Card Renderer
            function renderCards(items, mediaType, isAppend) {
                let html = '';
                items.forEach((item, index) => {
                    const poster = `https://dramakan-tmdb-proxy.zabaazcreations.workers.dev/image/t/p/w500${item.poster_path}`;
                    const title = item.name || item.title || "Untitled";
                    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';
                    const year = (item.first_air_date || item.release_date || "").substring(0, 4) || "----";
                    
                    // Determine Type Badge
                    let typeBadge = (mediaType === 'movie' || item.title) ? 'Movie' : 'Series';
                    if (item.genre_ids && item.genre_ids.includes(16)) typeBadge = 'Anime';
                    else if (['ko', 'zh', 'th'].includes(item.original_language) && typeBadge === 'Series') typeBadge = 'Drama';

                    const delay = (index * 0.04).toFixed(2);

                    html += `
                        <a href="details.html?id=${item.id}" class="media-card" style="transition-delay: ${delay}s">
                            <span class="badge-type">${typeBadge}</span>
                            <span class="badge-rating"><i class="fas fa-star"></i> ${rating}</span>
                            <img src="${poster}" alt="${title}" loading="lazy" decoding="async">
                            <div class="card-overlay">
                                <h3 class="card-title">${title}</h3>
                                <div class="card-meta">
                                    <span>${year}</span>
                                    <span>•</span>
                                    <span style="color:#d8b4fe; text-transform:uppercase; font-weight:700;">${item.original_language}</span>
                                </div>
                            </div>
                            <div class="play-overlay-btn"><i class="fas fa-play"></i></div>
                        </a>
                    `;
                });

                if (isAppend) {
                    grid.insertAdjacentHTML('beforeend', html);
                } else {
                    grid.innerHTML = html;
                }

                setTimeout(() => {
                    grid.querySelectorAll('.media-card:not(.loaded)').forEach(card => card.classList.add('loaded'));
                }, 50);
            }

            // Filter Event Watchers
            const filterInputs = [sortSelect, yearSelect, ...langRadios, ...genreCheckboxes];
            filterInputs.forEach(input => {
                input.addEventListener('change', () => fetchContent(false));
            });

            resetBtn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                categoryBtns[0].classList.add('active');
                activeCategory = 'all';
                displayTitle.textContent = "Discover All Content";

                sortSelect.value = 'popularity.desc';
                yearSelect.value = '';
                langRadios[0].checked = true;
                genreCheckboxes.forEach(cb => cb.checked = false);
                
                fetchContent(false);
                if (window.innerWidth <= 992) toggleMobileSidebar(false);
            });

            // Infinite Scroll
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isFetching && currentPage < totalPages) {
                    currentPage++;
                    fetchContent(true);
                }
            }, { rootMargin: "500px" });
            observer.observe(spinner);

            // Responsive Sidebar Drawer
            function toggleMobileSidebar(show) {
                if (show) {
                    sidebar.classList.add('active');
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                } else {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            mobileBtn.addEventListener('click', () => toggleMobileSidebar(true));
            closeBtn.addEventListener('click', () => toggleMobileSidebar(false));
            overlay.addEventListener('click', () => toggleMobileSidebar(false));

            fetchContent(false);
        });
    </script>
</body>
</html>
